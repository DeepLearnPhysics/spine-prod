# Generic simulation model configuration
# Revision date: July 18, 2024

__meta__:
  kind: bundle
  version: "240718"
  date: "2024-07-18"
  description: "Generic simulation model 2x2 weights (debug)"
  compatible_with:
    base: ">=240718"
    io: ">=240718"
  tags: []
  training_set: "v1"

include: model_common.yaml

override:
  # First full chain weights for generic simulations
  model.weight_path: !download
    url: https://s3df.slac.stanford.edu/data/neutrino/spine/weights/generic/generic_snapshot_240718.ckpt
    hash: 94f47955e5d8ac7c8d39465e795a58ff48c65629b3b62c4b35954c5a7e38ba84

  # Reuse the exact dated segmentation and point-proposal components.
  model.modules.uresnet_ppn: !include model/generic/uresnet_ppn/network_240718.yaml
  model.modules.uresnet_ppn_loss: !include model/generic/uresnet_ppn/loss_240718.yaml

  # Reuse the exact dated components trained by the standalone recipes.
  model.modules.graph_spice: !include model/generic/graph_spice/network_240718.yaml
  model.modules.graph_spice_loss: !include model/generic/graph_spice/loss_240718.yaml
  model.modules.grappa_shower: !include model/generic/grappa_shower/network_240718.yaml
  model.modules.grappa_shower_loss: !include model/generic/grappa_shower/loss_240718.yaml
  model.modules.grappa_track: !include model/generic/grappa_track/network_240718.yaml
  model.modules.grappa_track_loss: !include model/generic/grappa_track/loss_240718.yaml
  model.modules.grappa_inter: !include model/generic/grappa_inter/network_240718.yaml
  model.modules.grappa_inter_loss: !include model/generic/grappa_inter/loss_240718.yaml
