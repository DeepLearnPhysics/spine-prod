# Data-only modification for generic simulation configs
# Revision date: July 18, 2024

__meta__:
  kind: mod
  name: "data"
  version: "240718"
  date: "2024-07-18"
  description: "Data-only configuration"
  applies_to: [data]
  compatible_with:
    post: ">=240718"

include: mod_data_common.yaml
override:
  post.stages~:
    - remove:
        name: children_count
    - remove:
        name: match
    - update:
        name: direction
        changes:
          run_mode: reco
    - update:
        name: calo_ke
        changes:
          run_mode: reco
    - update:
        name: containment
        changes:
          run_mode: reco
    - update:
        name: topology_threshold
        changes:
          run_mode: reco
    - update:
        name: fiducial
        changes:
          run_mode: reco
