__meta__:
  kind: fragment
  description: Run DUNE-HD inference on a primary/secondary joint dataset

override:
  # Route overlays by their primary input while preserving both sources'
  # provenance. Requires SPINE's primary-only split writer policy.
  base.split_output: true
  io.writer.split_source: primary

  io.loader.dataset:
    provider: joint
    base: !include infer/dune-hd-10kt-1x2x6/io/dataset_joint.yaml
    primary:
      file_keys:
    secondary:
      file_keys:

  io.writer.keys-: run_info
