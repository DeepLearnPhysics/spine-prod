# Post-processing configuration for DUNE-HD 10 kt module 1x2x6
# Revision date: February 2, 2026

__meta__:
  kind: bundle
  version: "260202"
  date: "2026-02-02"
  description: "DUNE-HD 10 kt module 1x2x6 post-processing, February 2026"
  compatible_with:
    base: ">=260202"
    io: ">=260202"
    model: ">=260202"
  tags: [normalized-fm, shower-pp]

include: post_common.yaml

override:
  # Containment configuration
  post.stages~:
    - update:
        name: calo_ke
        changes:
          shower_fudge: 1.2359
    - update:
        name: shape_logic
        changes:
          maximum_michel_ke: 100
    - update:
        name: direction
        changes:
          radius: 60.0
    - insert:
        before: vertex
        value:
          name: particle_threshold
          primary_threshold: 0.1
    - insert:
        before: vertex
        value:
          name: shower_start_merge
          angle_threshold: 0.175
          distance_threshold: 1.0
          track_length_limit: 50
          track_dedx_limit:
    - insert:
        before: vertex
        value:
          name: shower_start_correction
          update_directions: true
          optimize: true
          radius: 60
    - insert:
        before: fiducial
        value:
          name: containment
          run_mode: both
          truth_point_mode: points_g4
          mode: source
          margin: 5.0
          cathode_margin: -5.0
          exclude_pids:
            - 0
            - 1
    - insert:
        before: fiducial
        value:
          name: time_containment
          logical: true
          mode: source
          margin: 0.0
          cathode_margin: -5.0
          exclude_pids:
            - 0
            - 1
    - insert:
        after: match
        value:
          name: start_dedx
          radius: 3.0
          mode: default
          include_pids:
            - 0
            - 1
            - 2
            - 3
            - 4
    - insert:
        after: start_dedx
        value:
          name: end_dedx
          radius: 3.0
          mode: default
          include_pids:
            - 2
            - 3
            - 4
    - insert:
        after: end_dedx
        value:
          name: start_straightness
          radius: 3.0
          n_components: 3
    - insert:
        after: start_straightness
        value:
          name: particle_spread
          start_mode: start_point
          use_start_dir: false
    - insert:
        after: particle_spread
        value:
          name: shower_conversion_distance
          mode: vertex_to_points
