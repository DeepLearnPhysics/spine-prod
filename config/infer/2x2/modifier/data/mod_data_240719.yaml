# Data-only modification for 2x2 configs
# Revision date: July 19, 2024

__meta__:
  kind: mod
  name: "data"
  version: "240719"
  date: "2024-07-19"
  description: "Data-only configuration"
  applies_to: [data]
  compatible_with:
    post: ">=240719"

include: mod_data_common.yaml
override:
  post.stages~:
    - remove:
        name: children_count
    - remove:
        name: match
    - update:
        name: calo_ke
        changes:
          run_mode: reco
    - update:
        name: containment
        changes:
          run_mode: reco
    - update:
        name: topology_threshold
        changes:
          run_mode: reco
    - update:
        name: fiducial
        changes:
          run_mode: reco
