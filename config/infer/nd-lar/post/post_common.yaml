# Post-processing common configuration for ND-LAr

__meta__:
  kind: fragment

# Run post-processors
post:
  stages:
    - name: shape_logic
      enforce_pid: true
      enforce_primary: true
    - name: direction
      run_mode: reco
      obj_type: particle
      optimize: true
      radius: 60
    - name: calibration
      do_tracking: false
      gain:
        gain: 42372.8813559322
      recombination:
        efield: 0.5
        model: birks
        birks_a: 0.8
        birks_k: 0.0486
        segment_length: 5
        min_count: 10
      lifetime:
        lifetime: 2200
        driftv: 0.164
    - name: calo_ke
      run_mode: both
      scaling: 1.0
      shower_fudge: 1/0.77
    - name: csda_ke
      run_mode: reco
      tracking_mode: step_next
      segment_length: 5.0
    - name: containment
      run_mode: both
      margin: 5.0
      mode: detector
    - name: vertex
      run_mode: reco
      use_primaries: true
      update_primaries: false
    - name: mcs_ke
      run_mode: reco
      tracking_mode: bin_pca
      segment_length: 14.0
      res_a: 0.24388893
      res_b: 1.39055786
      res_mixture: true
      res_scale_ratio: 2.0
      res_weight_ratio: 0.5
    - name: topology_threshold
      run_mode: both
      ke_thresholds:
        4: 50
        default: 25
    - name: fiducial
      run_mode: both
      margin: 10.0
      mode: module
    - name: children_count
      mode: shape
    - name: match
      match_mode: both
      ghost: false
      truth_point_mode: points
      fragment: false
      particle: true
      interaction: true
