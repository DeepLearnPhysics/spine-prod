__meta__:
  kind: fragment
  description: Common ND-LAr LArCV inference dataset

provider: larcv
file_keys:
schema:
  data:
    provider: sparse3d
    sparse_event: sparse3d_pcluster
  seg_label:
    provider: sparse3d
    sparse_event: sparse3d_pcluster_semantics
  ppn_label:
    provider: particle_points
    sparse_event: sparse3d_pcluster
    particle_event: particle_pcluster
    include_point_tagging: false
  clust_label:
    provider: cluster3d
    cluster_event: cluster3d_pcluster
    particle_event: particle_pcluster
    neutrino_event: neutrino_mc_truth
    sparse_semantics_event: sparse3d_pcluster_semantics
    add_particle_info: true
    clean_data: true
  coord_label:
    provider: particle_coords
    particle_event: particle_pcluster
    cluster_event: cluster3d_pcluster
  particles:
    provider: particle
    particle_event: particle_pcluster
    neutrino_event: neutrino_mc_truth
    cluster_event: cluster3d_pcluster
    skip_empty: true
  neutrinos:
    provider: neutrino
    neutrino_event: neutrino_mc_truth
    cluster_event: cluster3d_pcluster
    interaction_scheme: genie
  meta:
    provider: meta
    sparse_event: sparse3d_pcluster
  run_info:
    provider: run_info
    sparse_event: sparse3d_pcluster
  trigger:
    provider: trigger
    trigger_event: trigger_base
  flashes:
    provider: flash
    flash_event: opflash_light
