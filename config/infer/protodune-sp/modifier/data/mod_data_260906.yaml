# Data-only modification for the ProtoDUNE-SP 260906 model configuration

__meta__:
  kind: mod
  name: "data"
  version: "260906"
  date: "2026-09-06"
  description: "Data-only configuration with the collection-plane data gain"
  applies_to: [data]
  compatible_with:
    model: ">=260906"
    post: ">=260210"

include: mod_data_common.yaml

override:
  # Invert the collection-plane data calibration constant (ADC/electron).
  model.modules.calibration.stages~:
    - update:
        name: gain
        changes:
          gain: 963.3911368015414
  post.stages~:
    - remove:
        name: children_count
    - remove:
        name: match
    - update:
        name: calo_ke
        changes:
          run_mode: reco
    - remove:
        name: containment
    - insert:
        before: time_containment
        value:
          name: containment
          run_mode: reco
          mode: source
          margin: 5.0
          cathode_margin: -5.0
          exclude_pids:
            - 0
            - 1
    - update:
        name: time_containment
        changes:
          run_mode: reco
    - update:
        name: fiducial
        changes:
          run_mode: reco
    - remove:
        name: topology_threshold
    - insert:
        before: start_dedx
        value:
          name: topology_threshold
          run_mode: reco
          ke_thresholds:
            1: 50
            4: 50
            default: 25
