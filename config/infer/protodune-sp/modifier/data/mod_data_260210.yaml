# Data-only modification for ProtoDUNE-SP configs
# Revision date: February 10, 2026

__meta__:
  kind: mod
  name: "data"
  version: "260210"
  date: "2026-02-10"
  description: "Data-only configuration"
  applies_to: [data]
  compatible_with:
    post: ">=260210"

include: mod_data_common.yaml

#override:
### Post-processing overrides ###
# Set calibration parameters for data (post-processor)
#  model.modules.calibration:
#    stage: segmentation
#    gain:
#      gain: 46.478 # e-/ADC for the collection planes
#    recombination:
#      model: mbox
#      efield: 0.5 # kV/cm
#    lifetime:
#      lifetime: 35000 # us
#      driftv: 0.1563 # cm/us
override:
  post.stages~:
    - remove:
        name: children_count
    - remove:
        name: match
    - update:
        name: calo_ke
        changes:
          run_mode: reco
    - remove:
        name: containment
    - insert:
        before: time_containment
        value:
          name: containment
          run_mode: reco
          mode: source
          margin: 5.0
          cathode_margin: -5.0
          exclude_pids:
            - 0
            - 1
    - update:
        name: time_containment
        changes:
          run_mode: reco
    - update:
        name: fiducial
        changes:
          run_mode: reco
    - remove:
        name: topology_threshold
    - insert:
        before: start_dedx
        value:
          name: topology_threshold
          run_mode: reco
          ke_thresholds:
            1: 50
            4: 50
            default: 25
