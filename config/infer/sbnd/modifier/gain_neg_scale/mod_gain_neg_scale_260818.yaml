# SBND post-deghosting -5% gain detector variation
# Revision date: August 18, 2026

__meta__:
  kind: mod
  name: "gain_neg_scale"
  version: "260818"
  date: "2026-08-18"
  description: "Post-deghosting -5% gain detector variation"
  applies_to: [mc]
  compatible_with:
    model: "<260501"
  conflicts_with: [gain_pos_scale]

override:
  model.network_input.meta: meta

  # Keep one calibration stage when combining detector variations.
  model.modules.chain.stages-:
    - name: calibration_before_segmentation
      provider: calibration
      uses: calibration
      config:
        mode: apply
  model.modules.chain.stages~:
    - insert:
        before: segmentation
        value:
          name: calibration_before_segmentation
          provider: calibration
          uses: calibration
          config:
            mode: apply
  model.modules.calibration:
    stages:
      - name: gain
        gain: 0.95
  post.stages~:
    - update:
        name: apply_calibrations
        changes:
          depositions_source: depositions
