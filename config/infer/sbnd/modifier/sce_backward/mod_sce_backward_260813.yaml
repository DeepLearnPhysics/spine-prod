# SBND backward SCE map variation
# Revision date: August 13, 2026

__meta__:
  kind: mod
  name: "sce_backward"
  version: "260813"
  date: "2026-08-13"
  description: "Backward SCE detector variation"
  applies_to: [mc]
  compatible_with:
    model: "<260501"
  conflicts_with: [sce_forward]

override:
  model.network_input.meta: meta

  # Keep one calibration stage when combining detector variations.
  model.modules.chain.stages-:
    - name: calibration_before_segmentation
      provider: calibration
      uses: calibration
      config:
        mode: apply
  model.modules.chain.stages~:
    - insert:
        before: segmentation
        value:
          name: calibration_before_segmentation
          provider: calibration
          uses: calibration
          config:
            mode: apply
  model.modules.calibration:
    stages:
      - name: field
        map_file: $SBND_DATA_DIR/v01_42_00/SCEoffsets/SCEoffsets_SBND_E500_dualmap_voxelTH3.root
        map_prefix: TrueBkwd_Displacement
        map_suffixes: [_E, _W]
        map_selection_axis: 0
        map_selection_boundaries: [0.0]
