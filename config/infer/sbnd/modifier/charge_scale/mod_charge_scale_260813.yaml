# SBND charge-scale detector variation
# Revision date: August 13, 2026

__meta__:
  kind: mod
  name: "charge_scale"
  version: "260813"
  date: "2026-08-13"
  description: "Charge-scale detector variation"
  applies_to: [mc]
  compatible_with:
    model: "<260501"

override:
  model.network_input.meta: meta

  # Keep one calibration stage when combining detector variations.
  model.modules.chain.stages-:
    - name: calibration_before_segmentation
      provider: calibration
      uses: calibration
      config:
        mode: apply
  model.modules.chain.stages~:
    - insert:
        before: segmentation
        value:
          name: calibration_before_segmentation
          provider: calibration
          uses: calibration
          config:
            mode: apply
  model.modules.calibration:
    response:
      # Apply the response variation before charge calibrations.
      priority: 10
      response_func: 0.9894425*x + 7.6032e-7*x*x - 2.552e-7*x*x*x + 6.74704e-11*x*x*x*x
    smearing:
      # Apply the smearing after the response function
      priority: 9
      distribution: normal
      mode: multiplicative
      mean: 1.0
      scale: 0.0511

  post.apply_calibrations.depositions_source: depositions
