# SBND 15% charge-smearing detector variation
# Revision date: August 18, 2026

__meta__:
  kind: mod
  name: "smearing"
  version: "260818"
  date: "2026-08-18"
  description: "15% charge-smearing detector variation"
  applies_to: [mc]
  compatible_with:
    model: "<260501"

override:
  model.network_input.meta: meta

  # Keep one calibration stage when combining detector variations.
  model.modules.chain.stages-:
    - name: calibration_before_segmentation
      provider: calibration
      uses: calibration
      config:
        mode: apply
  model.modules.chain.stages~:
    - insert:
        before: segmentation
        value:
          name: calibration_before_segmentation
          provider: calibration
          uses: calibration
          config:
            mode: apply
  model.modules.calibration:
    response:
      # Apply the central response correction before charge calibrations.
      priority: 10
      response_func: 0.9894425*x + 7.6032e-7*x*x - 2.552e-7*x*x*x + 6.74704e-11*x*x*x*x
    smearing:
      # Increase charge smearing from 5.11% to 15% after the response correction.
      priority: 9
      distribution: normal
      mode: multiplicative
      mean: 1.0
      scale: 0.15

  post.apply_calibrations.depositions_source: depositions
