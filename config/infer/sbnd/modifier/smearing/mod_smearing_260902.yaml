# SBND 25% charge-smearing detector variation
# Revision date: September 2, 2026

__meta__:
  kind: mod
  name: "smearing"
  version: "260902"
  date: "2026-09-02"
  description: "25% charge-smearing detector variation"
  applies_to: [mc]
  compatible_with:
    model: "<260501"

override:
  model.network_input.meta: meta

  # Keep one calibration stage when combining detector variations.
  model.modules.chain.stages-:
    - name: calibration_before_segmentation
      provider: calibration
      uses: calibration
      config:
        mode: apply
  model.modules.chain.stages~:
    - insert:
        before: segmentation
        value:
          name: calibration_before_segmentation
          provider: calibration
          uses: calibration
          config:
            mode: apply
  model.modules.calibration:
    stages:
      - name: response
        response_func: 0.9894425*x + 7.6032e-7*x*x - 2.552e-7*x*x*x + 6.74704e-11*x*x*x*x
      - name: smearing
        distribution: normal
        mode: multiplicative
        mean: 1.0
        scale: 0.25
  post.stages~:
    - update:
        name: apply_calibrations
        changes:
          depositions_source: depositions
