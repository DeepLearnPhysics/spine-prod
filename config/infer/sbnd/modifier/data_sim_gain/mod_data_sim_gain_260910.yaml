# SBND data-only modification matched to the 250901 simulation response
# Revision date: September 10, 2026

__meta__:
  kind: mod
  name: "data_sim_gain"
  version: "260910"
  date: "2026-09-10"
  description: "SBND data-only configuration matched to the 250901 simulation gain"
  applies_to: [data]
  compatible_with:
    model: "==250901"
    post: "==250901"

include: ../data/mod_data_common.yaml

override:
  ### Model overrides ###
  # The applied response stage requires detector metadata.
  model.network_input.meta: meta

  # Match the charge seen by semantic segmentation to simulation. Data uses
  # 46.478 e-/ADC while the 250901 simulation uses 49.819 e-/ADC.
  # Keep one calibration stage when combining detector variations.
  model.modules.chain.stages-:
    - name: calibration_before_segmentation
      provider: calibration
      uses: calibration
      config:
        mode: apply
  model.modules.chain.stages~:
    - insert:
        before: segmentation
        value:
          name: calibration_before_segmentation
          provider: calibration
          uses: calibration
          config:
            mode: apply
  model.modules.calibration:
    stages:
      - name: response
        response_func: 46.478/49.819*x
  post.stages~:
    - remove:
        name: children_count
    - remove:
        name: match
    - update:
        name: direction
        changes:
          run_mode: reco
    - update:
        name: time_containment
        changes:
          run_mode: reco
    - update:
        name: apply_calibrations
        changes:
          depositions_source: depositions
          lifetime:
            lifetime: 35000
    - update:
        name: calo_ke
        changes:
          run_mode: reco
    - update:
        name: containment
        changes:
          run_mode: reco
    - update:
        name: topology_threshold
        changes:
          run_mode: reco
    - update:
        name: fiducial
        changes:
          run_mode: reco
