# Data-only modification for SBND configs
# Revision date: July 20, 2024

__meta__:
  kind: mod
  name: "data"
  version: "240720"
  date: "2024-07-20"
  description: "Data-only configuration"
  applies_to: [data]
  compatible_with:
    model: "<260501"
    post: "<=250328"

include: mod_data_common.yaml

override:
  post.stages~:
    - remove:
        name: children_count
    - remove:
        name: match
    - update:
        name: direction
        changes:
          run_mode: reco
    - update:
        name: apply_calibrations
        changes:
          gain:
            gain: 52.356
          lifetime:
            lifetime: 50000
    - update:
        name: calo_ke
        changes:
          run_mode: reco
    - update:
        name: containment
        changes:
          run_mode: reco
    - update:
        name: topology_threshold
        changes:
          run_mode: reco
    - update:
        name: fiducial
        changes:
          run_mode: reco
