# Data-only modification for SBND configs with in-model calibration
# Revision date: May 1, 2026

__meta__:
  kind: mod
  name: "data"
  version: "260501"
  date: "2026-05-01"
  description: "Data-only configuration with Gen-II calibration"
  applies_to: [data]
  compatible_with:
    model: ">=260501"
    post: ">=260501"

include: mod_data_common.yaml

override:
  ### Model overrides ###
  # Provide the run number needed for the lifetime database lookup.
  model.network_input.run_info: run_info

  # Set calibration parameters for data before semantic segmentation.
  model.modules.calibration.stages~:
    - update:
        name: gain
        changes:
          gain: 45.652
    - remove:
        name: lifetime
    - insert:
        after: recombination
        value:
          name: lifetime
          lifetime_db: $SBND_DATA_DIR/v01_42_00/CalibrationDatabase/tpc_elifetime.db
          lifetime_db_value_keys:
            - etau_sce_spatial_east
            - etau_sce_spatial_west
          lifetime_db_value_scale: 1000.0
          driftv: 0.1563
    - insert:
        after: lifetime
        value:
          name: transparency
          transparency_file: $SBND_DATA_DIR/v01_42_00/YZmaps/yz_data2025_v10_14_02.root
          map_type: correction
  post.stages~:
    - remove:
        name: children_count
    - remove:
        name: match
    - update:
        name: direction
        changes:
          run_mode: reco
    - update:
        name: time_containment
        changes:
          run_mode: reco
    - update:
        name: calo_ke
        changes:
          run_mode: reco
    - update:
        name: containment
        changes:
          run_mode: reco
    - update:
        name: topology_threshold
        changes:
          run_mode: reco
    - update:
        name: fiducial
        changes:
          run_mode: reco
