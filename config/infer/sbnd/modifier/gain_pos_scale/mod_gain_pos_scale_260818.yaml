# SBND post-deghosting +5% gain detector variation
# Revision date: August 18, 2026

__meta__:
  kind: mod
  name: "gain_pos_scale"
  version: "260818"
  date: "2026-08-18"
  description: "Post-deghosting +5% gain detector variation"
  applies_to: [mc]
  compatible_with:
    model: "<260501"
  conflicts_with: [gain_neg_scale]

override:
  model.network_input.meta: meta

  # Keep one calibration stage when combining detector variations.
  model.modules.chain.stages-:
    - name: calibration_before_segmentation
      provider: calibration
      uses: calibration
      config:
        mode: apply
  model.modules.chain.stages~:
    - insert:
        before: segmentation
        value:
          name: calibration_before_segmentation
          provider: calibration
          uses: calibration
          config:
            mode: apply
  model.modules.calibration:
    gain:
      # Apply the multiplicative gain variation before post-deghosting calibration.
      priority: 10
      gain: 1.05

  post.apply_calibrations.depositions_source: depositions
