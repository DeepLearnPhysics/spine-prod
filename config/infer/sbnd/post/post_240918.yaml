# Post-processing configuration for SBND
# Revision date: September 18, 2024

__meta__:
  kind: bundle
  version: "240918"
  date: "2024-09-18"
  description: "SBND post-processing for September 2024 weights"
  compatible_with:
    base: ">=240720"
    io: ">=240720"
    model: ">=240720"
  tags: [post-calibration, absolute-fm]

include: post_common.yaml

override:
  # Flash matching configuration
  post.stages~:
    - insert:
        before: vertex
        value:
          name: flash_match
          flash_key: flashes
          volume: tpc
          method: likelihood
          cfg: !path infer/sbnd/post/flashmatch/flashmatch_240918.cfg
          scaling: 1./555.
          alpha: 0.21
          recombination_mip: 0.6
    - remove:
        name: vertex
    - insert:
        before: calo_ke
        value:
          name: vertex
          use_primaries: true
          update_primaries: false
          run_mode: reco
    - insert:
        before: calo_ke
        value:
          name: apply_calibrations
          gain:
            gain: 57.0
          recombination:
            efield: 0.5
            model: mbox
          lifetime:
            lifetime: 35000
            driftv: 0.1563
    - update:
        name: calo_ke
        changes:
          shower_fudge: 1/0.77
    - insert:
        before: topology_threshold
        value:
          name: mcs_ke
          run_mode: reco
          tracking_mode: bin_pca
          segment_length: 14.0
          fill_per_pid: true
    - insert:
        before: topology_threshold
        value:
          name: containment
          run_mode: both
          mode: source
          margin: 5.0
          cathode_margin: -5.0
          min_particle_sizes:
            0: 25
            1: 25
