# ICARUS gain +2% detector variation modifier
# Revision date: September 2, 2026

__meta__:
  kind: mod
  name: "gain_pos_scale"
  version: "260902"
  date: "2026-09-02"
  description: "Gain +2% detector variation"
  applies_to: [mc]
  compatible_with:
    model: ">=250303"
  conflicts_with: [gain_neg_scale]

override:
  # Apply the scale before the nominal gain and remaining charge calibrations.
  model.modules.calibration.gain_scale:
    name: response
    priority: 10
    response_func: 1.02*x
