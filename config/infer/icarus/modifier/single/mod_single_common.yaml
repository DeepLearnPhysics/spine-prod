# Single-cryostat modification for ICARUS configs, common settings
# Include this after the main config to process single-cryostat simulations

__meta__:
  kind: fragment

include: io_single_common.yaml

override:
  # Node orientation can be predicted (coord_label works when no split)
  model.modules.grappa_inter_loss.node_loss.orient:
    name: orient
    loss: ce

  # Remove threshold-based adjustments to primary
  post-: particle_threshold

  # Use the NuMI-specific flashmatch configuration (MPV generation window matches NuMI)
  # post.flash_match.cfg varies by config - override in specific configs
