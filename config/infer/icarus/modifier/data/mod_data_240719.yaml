# Data-only modification for ICARUS configs
# Revision date: July 19, 2024

__meta__:
  kind: mod
  name: "data"
  version: "240719"
  date: "2024-07-19"
  description: "Data-only configuration"
  applies_to: [data]
  compatible_with:
    post: "<=250115"

include: mod_data_common.yaml

override:
  post.stages~:
    - remove:
        name: children_count
    - remove:
        name: match
    - remove:
        name: apply_calibrations
    - insert:
        before: calo_ke
        value:
          name: apply_calibrations
          gain:
            gain:
              - 76.02
              - 75.29
              - 77.36
              - 77.1
          recombination:
            model: mbox
            efield: 0.4938
          lifetime:
            lifetime_db: /sdf/data/neutrino/icarus/db/v09_84_01/tpc_elifetime_data.db
            driftv_db: /sdf/data/neutrino/icarus/db/v09_84_01/tpc_edriftvelocity_data.db
          transparency:
            transparency_db: /sdf/data/neutrino/icarus/db/v09_84_01/tpc_yz_correction_data.db
    - insert:
        before: calo_ke
        value:
          name: trigger
          file_path: /sdf/data/neutrino/icarus/trigger/trigger_04032026.csv
          flash_keys:
            - flashes
          correct_flash_times: true
          flash_time_corr_us: 4
    - update:
        name: calo_ke
        changes:
          run_mode: reco
    - update:
        name: containment
        changes:
          run_mode: reco
    - update:
        name: fiducial
        changes:
          run_mode: reco
    - update:
        name: topology_threshold
        changes:
          run_mode: reco
    - update:
        name: flash_match
        changes:
          scaling: 1/1400
