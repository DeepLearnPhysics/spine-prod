# Data-only modification for ICARUS configs
# Revision date: June 25, 2025

__meta__:
  kind: mod
  name: "data"
  version: "250625"
  date: "2025-06-25"
  description: "Data-only configuration"
  applies_to: [data]
  compatible_with:
    model: ">=250303"

    post: ">=250625"
include: mod_data_common.yaml

override:
  ### Model overrides ###
  # Set calibration parameters for data (before segmentation stage)
  post.stages~:
    - remove:
        name: children_count
    - remove:
        name: match
    - insert:
        before: calo_ke
        value:
          name: trigger
          file_path: /sdf/data/neutrino/icarus/trigger/trigger_04032026.csv
          flash_keys:
            - flashes
          correct_flash_times: true
          flash_time_corr_us: 4
    - update:
        name: calo_ke
        changes:
          run_mode: reco
    - remove:
        name: containment
    - insert:
        before: time_containment
        value:
          name: containment
          run_mode: reco
          mode: source
          margin: 5.0
          cathode_margin: -5.0
          exclude_pids:
            - 0
            - 1
    - update:
        name: time_containment
        changes:
          run_mode: reco
    - update:
        name: fiducial
        changes:
          run_mode: reco
    - remove:
        name: topology_threshold
    - insert:
        before: flash_match
        value:
          name: topology_threshold
          run_mode: reco
          ke_thresholds:
            1: 50
            4: 50
            default: 25
  model.modules.calibration:
    gain:
      gain: [76.13, 75.39, 77.46, 77.21] # e-/ADC for the collection planes
    recombination:
      model: mbox
      efield: 0.4938 # kV/cm
      mip_dedx: 2.105168 # MeV/cm
    lifetime:
      lifetime_db: /sdf/data/neutrino/icarus/db/v09_84_01/tpc_elifetime_data.db
      driftv_db: /sdf/data/neutrino/icarus/db/v09_84_01/tpc_edriftvelocity_data.db
    transparency:
      transparency_db: /sdf/data/neutrino/icarus/db/v09_84_01/tpc_yz_correction_data.db
