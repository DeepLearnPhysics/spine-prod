# Post-processing configuration for ICARUS
# Revision date: January 15, 2025

__meta__:
  kind: bundle
  version: "250115"
  date: "2025-01-15"
  description: "ICARUS post-processing with updated calibrations"
  compatible_with:
    base: ">=240719"
    io: ">=240719"
    model: "<=250115"
  tags: [post-calibration, absolute-fm]

include: post_common.yaml

override:
  # Apply calibrations during post-processing
  post.stages~:
    - insert:
        before: calo_ke
        value:
          name: apply_calibrations
          gain:
            gain: 84.2408
          recombination:
            efield: 0.4938
            model: mbox
          lifetime:
            lifetime: 3000
            driftv: 0.157565
    - update:
        name: calo_ke
        changes:
          shower_fudge: 1/0.83
    - update:
        name: direction
        changes:
          radius: 60.0
    - insert:
        before: vertex
        value:
          name: particle_threshold
          primary_threshold: 0.1
    - remove:
        name: vertex
    - insert:
        before: mcs_ke
        value:
          name: vertex
          run_mode: reco
          use_primaries: true
          update_primaries: false
    - insert:
        before: fiducial
        value:
          name: containment
          run_mode: both
          mode: source
          margin: 5.0
          cathode_margin: -5.0
          min_particle_sizes:
            0: 25
            1: 25
    - remove:
        name: topology_threshold
    - insert:
        before: children_count
        value:
          name: topology_threshold
          run_mode: both
          ke_thresholds:
            4: 50
            default: 25
    - insert:
        after: match
        value:
          name: flash_match
          cfg: !path infer/icarus/post/flashmatch/flashmatch_230930.cfg
          legacy: true
          flash_key: flashes
          volume: module
          ref_volume_id: 0
          scaling: 1/350
          method: likelihood
