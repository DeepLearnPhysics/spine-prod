# Post-processing configuration for ICARUS
# Revision date: May 1, 2026

__meta__:
  kind: bundle
  version: "260501"
  date: "2026-05-01"
  description: "ICARUS post-processing, latest"
  compatible_with:
    base: ">=240719"
    io: ">=240719"
    model: ">=260410"
  tags: [normalized-fm, shower-pp]

include: post_common.yaml

override:
  # Flash matching configuration
  post.stages~:
    - update:
        name: calo_ke
        changes:
          shower_fudge: 1.2048
    - update:
        name: shape_logic
        changes:
          maximum_michel_ke: 100
    - update:
        name: direction
        changes:
          radius: 60.0
    - insert:
        before: vertex
        value:
          name: particle_threshold
          primary_threshold: 0.1
    - insert:
        before: vertex
        value:
          name: shower_start_merge
          angle_threshold: 0.175
          distance_threshold: 1.0
          track_length_limit: 50
          track_dedx_limit:
    - insert:
        before: vertex
        value:
          name: shower_start_correction
          update_directions: true
          optimize: true
          radius: 60
    - insert:
        before: fiducial
        value:
          name: containment
          run_mode: both
          truth_point_mode: points_g4
          mode: source
          margin: 5.0
          cathode_margin: -5.0
          exclude_pids:
            - 0
            - 1
    - insert:
        before: fiducial
        value:
          name: time_containment
          logical: true
          mode: source
          margin: 0.0
          cathode_margin: -5.0
          exclude_pids:
            - 0
            - 1
    - insert:
        after: match
        value:
          name: flash_match
          cfg: !path infer/icarus/post/flashmatch/flashmatch_250214.cfg
          flash_key: flashes
          volume: module
          ref_volume_id: 0
          method: likelihood
    - insert:
        after: flash_match
        value:
          name: start_dedx
          radius: 3.0
          mode: default
          include_pids:
            - 0
            - 1
            - 2
            - 3
            - 4
    - insert:
        after: start_dedx
        value:
          name: end_dedx
          radius: 3.0
          mode: default
          include_pids:
            - 2
            - 3
            - 4
    - insert:
        after: end_dedx
        value:
          name: start_straightness
          radius: 3.0
          n_components: 3
    - insert:
        after: start_straightness
        value:
          name: particle_spread
          start_mode: start_point
          use_start_dir: false
    - insert:
        after: particle_spread
        value:
          name: shower_conversion_distance
          mode: vertex_to_points
