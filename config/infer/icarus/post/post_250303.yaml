# Post-processing configuration for ICARUS
# Revision date: March 3, 2025

__meta__:
  kind: bundle
  version: "250303"
  date: "2025-03-03"
  description: "ICARUS post-processing for calibrated models"
  compatible_with:
    base: ">=240719"
    io: ">=240719"
    model: ">=250303"
  tags: [normalized-fm]

include: post_common.yaml

override:
  # Flash matching configuration
  post.stages~:
    - update:
        name: calo_ke
        changes:
          shower_fudge: 1.2359
    - update:
        name: direction
        changes:
          radius: 60.0
    - insert:
        before: vertex
        value:
          name: particle_threshold
          primary_threshold: 0.1
    - remove:
        name: vertex
    - insert:
        before: mcs_ke
        value:
          name: vertex
          run_mode: reco
          use_primaries: true
          update_primaries: false
    - insert:
        before: fiducial
        value:
          name: containment
          run_mode: both
          mode: source
          margin: 5.0
          cathode_margin: -5.0
          min_particle_sizes:
            0: 25
            1: 25
    - remove:
        name: topology_threshold
    - insert:
        before: children_count
        value:
          name: topology_threshold
          run_mode: both
          ke_thresholds:
            4: 50
            default: 25
    - insert:
        after: match
        value:
          name: flash_match
          cfg: !path infer/icarus/post/flashmatch/flashmatch_250214.cfg
          flash_key: flashes
          volume: module
          ref_volume_id: 0
          method: likelihood
