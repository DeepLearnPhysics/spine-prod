# Model common configuration for ProtoDUNE-VD

__meta__:
  kind: fragment

# Model configuration
model:
  provider: full_chain
  weight_path:
  # weight_path varies by config - override in specific configs
  to_numpy: true

  network_input:
    data: data
    sources: sources
    seg_label: seg_label
    meta: meta
    run_info: run_info

  modules:
    # General chain configuration
    chain:
      stages:
        - name: deghosting
          provider: deghost
          uses: uresnet_deghost
          loss: uresnet_deghost_loss
          config:
            mode: uresnet
            charge_rescaling:
        - name: segmentation
          uses: uresnet_ppn
          loss: uresnet_ppn_loss
          config:
            mode: uresnet
            point_proposal: ppn
        - name: fragmentation
          uses: graph_spice
          loss:
            graph_spice: graph_spice_loss
          config:
            mode: graph_spice
        - name: particle_aggregation
          uses:
            - grappa_shower
            - grappa_track
          loss:
            shower: grappa_shower_loss
            track: grappa_track_loss
          config:
            shower_aggregation: grappa
            shower_primary: grappa
            track_aggregation: grappa
            particle_aggregation:
        - name: interaction_aggregation
          uses: grappa_inter
          loss: grappa_inter_loss
          config:
            mode: grappa
            task_modes:
              type: grappa
              primary: grappa
              orient: grappa

    # Deghosting
    uresnet_deghost:
      num_input: 2
      num_classes: 2
      filters: 32
      depth: 5
      reps: 2
      allow_bias: false
      activation:
        provider: lrelu
        negative_slope: 0.33
      norm_layer:
        provider: batch_norm
        eps: 0.0001
        momentum: 0.01

    uresnet_deghost_loss:
      balance_loss: false

    # Calibration
    # calibration parameters vary by config - override in specific configs

    # Semantic segmentation + point proposal
    uresnet_ppn:
      uresnet:
        num_input: 1
        num_classes: 5
        filters: 32
        depth: 5
        reps: 2
        allow_bias: false
        activation:
          provider: lrelu
          negative_slope: 0.33
        norm_layer:
          provider: batch_norm
          eps: 0.0001
          momentum: 0.01

      ppn:
        classify_endpoints: false

    uresnet_ppn_loss:
      uresnet_loss:
        balance_loss: false

      ppn_loss:
        mask_loss: CE
        resolution: 5.0
        # restrict_to_clusters varies by config - override in specific configs

    # Dense clustering
    graph_spice:
      shapes: [shower, track, michel, delta]
      use_raw_features: true
      invert: true
      make_clusters: true
      embedder:
        spatial_embedding_dim: 3
        feature_embedding_dim: 16
        occupancy_mode: softplus
        covariance_mode: softplus
        uresnet:
          num_input: 4 # 1 feature + 3 normalized coords
          filters: 32
          input_kernel: 5
          depth: 5
          reps: 2
          spatial_size: 6144
          allow_bias: false
          activation:
            provider: lrelu
            negative_slope: 0.33
          norm_layer:
            provider: batch_norm
            eps: 0.0001
            momentum: 0.01
      kernel:
        provider: bilinear
        num_features: 32
      constructor:
        edge_threshold: 0.1
        min_size: 3
        label_edges: false
        graph:
          provider: radius
          r: 1.9
        orphan:
          mode: radius
          radius: 1.9
          iterate: true
          assign_all: true

    graph_spice_loss:
      provider: edge
      loss: binary_log_dice_ce

    # Shower fragment aggregation + shower primary identification
    grappa_shower:
      nodes:
        source: cluster
        shapes: [shower, michel, delta]
        min_size: -1
        make_groups: true
        grouping_method: score
      graph:
        provider: complete
        max_length: [500, 0, 500, 500, 0, 0, 0, 25, 0, 25]
        dist_algorithm: recursive
      node_encoder:
        provider: geo
        use_numpy: true
        add_value: true
        add_shape: true
        add_points: true
        add_local_dirs: true
        dir_max_dist: 5
        add_local_dedxs: true
        dedx_max_dist: 5
      edge_encoder:
        provider: geo
        use_numpy: true
      gnn_model:
        provider: meta
        node_feats: 33 # 16 (geo) + 3 (extra) + 6 (points) + 6 (directions) + 2 (local dedxs)
        edge_feats: 19
        node_pred: 2
        edge_pred: 2
        edge_layer:
          provider: mlp
          mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
        node_layer:
          provider: mlp
          reduction: max
          attention: false
          message_mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
          aggr_mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm

    grappa_shower_loss:
      node_loss:
        provider: shower_primary
        high_purity: true
        use_group_pred: true
        # use_closest varies by config - override in specific configs
      edge_loss:
        provider: channel
        target: group
        high_purity: true

    # Track aggregation
    grappa_track:
      nodes:
        source: cluster
        shapes: [track]
        make_groups: true
        grouping_method: score
      graph:
        provider: complete
        max_length: 100
        dist_algorithm: recursive
      node_encoder:
        provider: geo
        use_numpy: true
        add_value: true
        add_shape: false
        add_points: true
        add_local_dirs: true
        dir_max_dist: 5
        add_local_dedxs: true
        dedx_max_dist: 5
      edge_encoder:
        provider: geo
        use_numpy: true
      gnn_model:
        provider: meta
        node_feats: 32 # 16 (geo) + 2 (extra) + 6 (points) + 6 (directions) + 2 (local dedxs)
        edge_feats: 19
        edge_pred: 2
        edge_layer:
          provider: mlp
          mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
        node_layer:
          provider: mlp
          reduction: max
          attention: false
          message_mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
          aggr_mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm

    grappa_track_loss:
      edge_loss:
        provider: channel
        target: group

    # Interaction aggregation, PID, primary, orientation
    grappa_inter:
      nodes:
        source: group
        shapes: [shower, track, michel, delta]
        min_size: -1
        make_groups: true
        # grouping_through_track varies by config - override in specific configs
      graph:
        provider: complete
        max_length: [500, 500, 0, 0, 25, 25, 25, 0, 0, 0]
        dist_algorithm: recursive
      node_encoder:
        provider: geo
        use_numpy: true
        add_value: true
        add_shape: true
        add_points: true
        add_local_dirs: true
        dir_max_dist: 5
        add_local_dedxs: true
        dedx_max_dist: 5
      edge_encoder:
        provider: geo
        use_numpy: true
      gnn_model:
        provider: meta
        node_feats: 33 # 16 (geo) + 3 (extra) + 6 (points) + 6 (directions) + 2 (local dedxs)
        edge_feats: 19
        node_pred:
          type: 5
          primary: 2
          orient: 2
        edge_pred: 2
        edge_layer:
          provider: mlp
          mlp:
            depth: 3
            width: 128
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
        node_layer:
          provider: mlp
          reduction: max
          attention: false
          message_mlp:
            depth: 3
            width: 128
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
          aggr_mlp:
            depth: 3
            width: 128
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm

    grappa_inter_loss:
      node_loss:
        type:
          provider: class
          target: pid
          loss: ce
          balance_loss: true
        primary:
          provider: class
          target: inter_primary
          loss: ce
          balance_loss: true
        #orient:
        #  name: orient
        #  loss: ce
      edge_loss:
        provider: channel
        target: interaction
