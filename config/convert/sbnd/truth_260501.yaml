# SBND truth conversion configuration
# Revision date: May 1, 2026

__meta__:
  kind: bundle
  version: "260501"
  date: "2026-05-01"
  description: "SBND LArCV-to-SPINE truth conversion configuration"

include:
  - infer/sbnd/base/base_260501.yaml
  - infer/sbnd/io/io_260218.yaml

# Overrides
override:
  # Only build truth objects
  build.mode: truth

  # Force CPU execution for truth-only parsing
  base.world_size: 0

  # Temporary workaround until SPINE produces sources labels without reco
  # No reconstructed information or wire-TPC-only source products to write
  io.writer.keys-:
    [
      points,
      depositions,
      reco_particles,
      reco_interactions,
      sources,
      sources_label,
    ]
