# ProtoDUNE-SP truth conversion configuration
# Revision date: February 10, 2026

__meta__:
  kind: bundle
  version: "260210"
  date: "2026-02-10"
  description: "ProtoDUNE-SP LArCV-to-SPINE truth conversion configuration"

include:
  - infer/protodune-sp/base/base_260210.yaml
  - infer/protodune-sp/io/io_260210.yaml

# Overrides
override:
  # Only build truth objects
  build.mode: truth

  # Force CPU execution for truth-only parsing
  base.world_size: 0

  # Temporary workaround until SPINE produces sources labels without reco
  # No reconstructed information or wire-TPC-only source products to write
  io.writer.keys-:
    [
      points,
      depositions,
      reco_particles,
      reco_interactions,
      sources,
      sources_label,
    ]
