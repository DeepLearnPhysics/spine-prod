# ICARUS East-cryostat-only truth conversion configuration
# Revision date: August 12, 2024

__meta__:
  kind: bundle
  version: "240812"
  date: "2024-08-12"
  description: "ICARUS East-only LArCV-to-SPINE truth conversion configuration"

include:
  - convert/icarus/truth_240812.yaml

# Some small ICARUS samples contain only East-cryostat products. Reuse the
# complete detector conversion policy while removing the unavailable West
# inputs from the multi-product parsers.
override:
  io.loader.dataset.schema.data.sparse_event_list-:
    - sparse3d_reco_cryoW
    - sparse3d_reco_cryoW_chi2
    - sparse3d_reco_cryoW_hit_charge0
    - sparse3d_reco_cryoW_hit_charge1
    - sparse3d_reco_cryoW_hit_charge2
    - sparse3d_reco_cryoW_hit_key0
    - sparse3d_reco_cryoW_hit_key1
    - sparse3d_reco_cryoW_hit_key2
  io.loader.dataset.schema.sources.sparse_event_list-:
    - sparse3d_reco_cryoW_cryo
    - sparse3d_reco_cryoW_tpc
  io.loader.dataset.schema.charge_label.sparse_event_list-:
    - sparse3d_reco_cryoW_rescaled
  io.loader.dataset.schema.flashes.flash_event_list-:
    - opflash_cryoW
