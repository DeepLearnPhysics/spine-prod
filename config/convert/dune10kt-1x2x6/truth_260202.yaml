# DUNE 10kt 1x2x6 truth conversion configuration
# Revision date: February 2, 2026

__meta__:
  kind: bundle
  version: "260202"
  date: "2026-02-02"
  description: "DUNE 10kt 1x2x6 LArCV-to-SPINE truth conversion configuration"

include:
  - infer/dune10kt-1x2x6/base/base_260202.yaml
  - infer/dune10kt-1x2x6/io/io_260202.yaml

# Overrides
override:
  # Only build truth objects
  build.mode: truth

  # Force CPU execution for truth-only parsing
  base.world_size: 0

  # Temporary workaround until SPINE produces sources labels without reco
  # No reconstructed information or wire-TPC-only source products to write
  io.writer.keys-:
    [
      points,
      depositions,
      reco_particles,
      reco_interactions,
      sources,
      sources_label,
    ]
