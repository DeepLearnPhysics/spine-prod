__meta__:
  kind: fragment
  description: SPINE v1 shared interaction GrapPA training policy and data schema

base:
  world_size: 1
  epochs: 50.0
  seed: 0
  unwrap: false
  log_dir:
  log_step: 1

io:
  loader:
    minibatch_size: 256
    shuffle: false
    num_workers: 16
    collate_fn: all
    sampler:
      provider: random_sequence
      seed: 0
    dataset:
      provider: larcv
      file_keys:
      schema:
        data:
          provider: cluster3d
          cluster_event: cluster3d_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          clean_data: true
          particle_info:
            particle_event: particle_corrected
            type_include_secondary: false
            type_include_mpr: false
            primary_include_mpr: false
        coord_label:
          provider: particle_coords
          particle_event: particle_corrected
          cluster_event: cluster3d_pcluster

train:
  weight_prefix:
  save_epoch: 1.0
  optimizer:
    provider: Adam
    lr: 0.001

validation:
  file_keys:
  fraction: 1.0
  early_stopping:
    monitor: loss
    mode: min
    patience: 5
    min_delta: 0.0
  best_checkpoint: true
