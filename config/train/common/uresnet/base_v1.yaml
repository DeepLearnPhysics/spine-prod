__meta__:
  kind: fragment
  description: SPINE v1 shared UResNet training policy and data schema

base:
  world_size: 1
  epochs: 50.0
  seed: 0
  unwrap: false
  log_dir:
  log_step: 1

io:
  loader:
    minibatch_size: 256
    shuffle: false
    num_workers: 16
    collate_fn: all
    sampler:
      provider: random_sequence
      seed: 0
    dataset:
      provider: larcv
      file_keys:
      schema:
        data:
          provider: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          provider: sparse3d
          sparse_event: sparse3d_pcluster_semantics

train:
  weight_prefix:
  save_epoch: 1.0
  optimizer:
    provider: Adam
    lr: 0.001

validation:
  file_keys:
  fraction: 1.0
  early_stopping:
    monitor: loss
    mode: min
    patience: 5
    min_delta: 0.0
  best_checkpoint: true
