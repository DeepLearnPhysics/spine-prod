__meta__:
  kind: fragment
  description: ProtoDUNE-SP shower GrapPA training from cached fragment graphs

include: train/protodune-sp/grappa_shower/base_v1.yaml

override:
  io.loader.dataset:
    name: cache
    path: null
    stage: fragmentation
    keys:
      - fragment_graph_shower_edge_index
      - fragment_graph_shower_node_features
      - fragment_graph_shower_edge_features
      - fragment_graph_shower_node_target
      - fragment_graph_shower_node_valid
      - fragment_graph_shower_edge_target
      - fragment_graph_shower_edge_valid

  model.network_input:
    edge_index: fragment_graph_shower_edge_index
    node_features: fragment_graph_shower_node_features
    edge_features: fragment_graph_shower_edge_features

  model.loss_input:
    node_target: fragment_graph_shower_node_target
    node_valid: fragment_graph_shower_node_valid
    edge_target: fragment_graph_shower_edge_target
    edge_valid: fragment_graph_shower_edge_valid

remove:
  - model.network_input.data
  - model.network_input.coord_label
  - model.loss_input.clust_label
  - model.loss_input.coord_label
  - model.modules.grappa.graph
  - model.modules.grappa.node_encoder
  - model.modules.grappa.edge_encoder
