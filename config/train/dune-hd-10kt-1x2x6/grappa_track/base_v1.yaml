__meta__:
  kind: fragment
  description: SPINE v1 DUNE-HD 10 kt module 1x2x6 track GrapPA training policy

base:
  world_size: 1
  epochs: 50.0
  seed: 0
  unwrap: false
  log_dir:
  log_step: 1

io:
  loader:
    minibatch_size: 32
    shuffle: false
    num_workers: 8
    collate_fn: all
    sampler:
      provider: random_sequence
      seed: 0

train:
  weight_prefix:
  save_epoch: 1.0
  optimizer:
    provider: Adam
    lr: 0.001

validation:
  file_keys:
  fraction: 1.0
  early_stopping:
    monitor: loss
    mode: min
    patience: 5
    min_delta: 0.0
  best_checkpoint: true
