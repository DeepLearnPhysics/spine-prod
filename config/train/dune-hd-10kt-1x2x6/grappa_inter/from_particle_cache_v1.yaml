__meta__:
  kind: fragment
  description: DUNE-HD 10 kt module 1x2x6 interaction GrapPA training from cached particle graphs

include: train/dune-hd-10kt-1x2x6/grappa_inter/base_v1.yaml

override:
  io.loader.dataset:
    provider: cache
    path:
    stage: particle_aggregation
    keys:
      - particle_graph_edge_index
      - particle_graph_node_features
      - particle_graph_edge_features
      - particle_graph_node_type_target
      - particle_graph_node_type_valid
      - particle_graph_node_primary_target
      - particle_graph_node_primary_valid
      - particle_graph_edge_target
      - particle_graph_edge_valid

  model.network_input:
    edge_index: particle_graph_edge_index
    node_features: particle_graph_node_features
    edge_features: particle_graph_edge_features

  model.loss_input:
    node_type_target: particle_graph_node_type_target
    node_type_valid: particle_graph_node_type_valid
    node_primary_target: particle_graph_node_primary_target
    node_primary_valid: particle_graph_node_primary_valid
    edge_target: particle_graph_edge_target
    edge_valid: particle_graph_edge_valid

remove:
  - model.modules.grappa.graph
  - model.modules.grappa.node_encoder
  - model.modules.grappa.edge_encoder
