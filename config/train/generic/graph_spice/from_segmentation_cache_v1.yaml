__meta__:
  kind: fragment
  description: Generic Graph-SPICE training policy backed by a staged segmentation cache

include: train/generic/graph_spice/base_v1.yaml

remove:
  - validation.file_keys

override:
  io.loader.dataset:
    name: mixed
    larcv:
      file_keys: null
      schema:
        data:
          parser: sparse3d
          sparse_event: sparse3d_pcluster
        clust_label:
          parser: cluster3d
          cluster_event: cluster3d_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          clean_data: true
          break_clusters: true
          particle_info:
            particle_event: particle_pcluster
    hdf5:
      file_keys: null
      staged: true
      stage: segmentation
      schema:
        seg_pred:
          parser: feature_tensor
          tensor_event: seg_pred

  validation.sources:
    larcv:
      file_keys: null
    hdf5:
      file_keys: null
