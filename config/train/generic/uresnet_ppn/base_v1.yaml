__meta__:
  kind: fragment
  description: SPINE v1 generic UResNet-PPN training policy and data schema

base:
  world_size: 1
  epochs: 50.0
  seed: 0
  unwrap: false
  log_dir: null
  log_step: 1

io:
  loader:
    batch_size: 128
    shuffle: false
    num_workers: 16
    collate_fn: all
    sampler:
      name: random_sequence
      seed: 0
    dataset:
      name: larcv
      file_keys: null
      schema:
        data:
          parser: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          parser: sparse3d
          sparse_event: sparse3d_pcluster_semantics
        ppn_label:
          parser: particle_points
          sparse_event: sparse3d_pcluster
          particle_event: particle_corrected
        clust_label:
          parser: cluster3d
          cluster_event: cluster3d_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          clean_data: true
          particle_info:
            particle_event: particle_corrected

train:
  weight_prefix: null
  save_epoch: 1.0
  optimizer:
    name: Adam
    lr: 0.001

validation:
  file_keys: null
  fraction: 1.0
  early_stopping:
    monitor: loss
    mode: min
    patience: 5
    min_delta: 0.0
  best_checkpoint: true
