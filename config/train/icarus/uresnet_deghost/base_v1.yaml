__meta__:
  kind: fragment
  description: SPINE v1 ICARUS deghosting training policy and data schema
base:
  world_size: 1
  epochs: 50.0
  seed: 0
  unwrap: false
  log_dir: null
  log_step: 1
io:
  loader:
    batch_size: 8
    shuffle: false
    num_workers: 16
    collate_fn: all
    sampler:
      provider: random_sequence
      seed: 0
    dataset:
      provider: larcv
      file_keys: null
      schema:
        data:
          provider: sparse3d
          sparse_event_list:
            - sparse3d_reco_cryoE
            - sparse3d_reco_cryoE_chi2
            - sparse3d_reco_cryoW
            - sparse3d_reco_cryoW_chi2
          num_features: 2
        seg_label:
          provider: sparse3d_ghost
          sparse_event: sparse3d_pcluster_semantics_ghost
train:
  weight_prefix: null
  save_epoch: 1.0
  optimizer:
    provider: Adam
    lr: 0.001
validation:
  file_keys: null
  fraction: 1.0
  early_stopping:
    monitor: loss
    mode: min
    patience: 5
    min_delta: 0.0
  best_checkpoint: true
