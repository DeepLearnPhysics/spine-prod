__meta__:
  kind: fragment
  description: ND-LAr detector-symmetry training augmentation shared by image models

geo:
  detector: nd-lar
  tag: up4-1

override:
  # Mixed datasets apply this after merging the primary and cache products,
  # keeping every coordinate-bearing tensor aligned through each reflection.
  # Validation derives an unaugmented loader from the training loader.
  io.loader.dataset.augment:
    flip_x:
      name: flip
      axis: 0
      use_geo_center: true
      keep_meta: true
      p: 0.5
    flip_y:
      name: flip
      axis: 1
      use_geo_center: true
      keep_meta: true
      p: 0.5
    flip_z:
      name: flip
      axis: 2
      use_geo_center: true
      keep_meta: true
      p: 0.5
