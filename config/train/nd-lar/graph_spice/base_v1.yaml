__meta__:
  kind: fragment
  description: SPINE v1 ND-LAr Graph-SPICE training policy and data schema

include: train/common/graph_spice/base_v1.yaml

remove:
  - io.loader.batch_size

override:
  # Conservative per-rank size validated on high-occupancy ND-LAr events.
  io.loader.minibatch_size: 4
  io.loader.dataset.schema.clust_label.particle_info.particle_event: particle_pcluster
  base.epochs: 75.0
