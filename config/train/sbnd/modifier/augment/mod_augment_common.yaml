__meta__:
  kind: fragment
  description: SBND detector reflections for image training
geo:
  detector: sbnd
  tag: sbndv2-6
override:
  io.loader.dataset.augment:
    stages:
      - name: flip_x
        provider: flip
        axis: 0
        use_geo_center: true
        keep_meta: true
        p: 0.5
      - name: flip_y
        provider: flip
        axis: 1
        use_geo_center: true
        keep_meta: true
        p: 0.5
      - name: flip_z
        provider: flip
        axis: 2
        use_geo_center: true
        keep_meta: true
        p: 0.5
