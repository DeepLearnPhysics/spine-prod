__meta__:
  kind: fragment
  description: 2x2 detector-symmetry training augmentation shared by image models

geo:
  detector: 2x2
  tag: mr5-0

override:
  # Mixed datasets apply this after merging the primary and cache products,
  # keeping every coordinate-bearing tensor aligned through each reflection.
  # Validation derives an unaugmented loader from the training loader.
  io.loader.dataset.augment:
    stages:
      - name: flip_x
        provider: flip
        axis: 0
        use_geo_center: true
        keep_meta: true
        p: 0.5
      - name: flip_y
        provider: flip
        axis: 1
        use_geo_center: true
        keep_meta: true
        p: 0.5
      - name: flip_z
        provider: flip
        axis: 2
        use_geo_center: true
        keep_meta: true
        p: 0.5
