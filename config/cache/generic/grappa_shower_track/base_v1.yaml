__meta__:
  kind: fragment
  description: Materialize particle graphs and interaction supervision

base:
  world_size: 1
  iterations: -1
  seed: 0
  unwrap: true
  split_output: true
  log_step: 1

io:
  loader:
    minibatch_size: 256
    shuffle: false
    num_workers: 16
    collate_fn: all
    dataset:
      name: hdf5
      file_keys: null
      staged: true
      stage: fragmentation
      # Canonical segmentation products remain owned by that stage; avoid
      # copying voxel-aligned tensors into every downstream stage.
      stage_map:
        ppn_points: segmentation
        clust_label_adapt: segmentation
      keep_open: true
      keys:
        - data
        - ppn_points
        - coord_label
        - clust_label_adapt
        - fragment_clusts
        - fragment_shapes
  writer:
    name: stage_hdf5
    file_name: null
    stage: particle_aggregation
    keep_open: true
    overwrite_stage: true
    keys:
      - particle_clusts
      - particle_edge_index
      - particle_node_features
      - particle_edge_features
      - interaction_aggregation_node_type_target
      - interaction_aggregation_node_type_valid
      - interaction_aggregation_node_primary_target
      - interaction_aggregation_node_primary_valid
      - interaction_aggregation_node_orient_target
      - interaction_aggregation_node_orient_valid
      - interaction_aggregation_edge_target
      - interaction_aggregation_edge_valid

model:
  name: full_chain
  to_numpy: true

  network_input:
    data: data
    ppn_points: ppn_points
    clust_label: clust_label_adapt
    coord_label: coord_label
    fragment_clusts: fragment_clusts
    fragment_shapes: fragment_shapes

  loss_input:
    clust_label: clust_label_adapt
    coord_label: coord_label

  modules:
    chain:
      inputs: [ppn_points, fragment_clusts, fragment_shapes]
      stages:
        - name: particle_aggregation
          provider: particle_aggregation
          uses: [grappa_shower, grappa_track]
          config:
            shower_aggregation: grappa
            shower_primary: grappa
            track_aggregation: grappa
            particle_aggregation: null

        - name: interaction_aggregation
          provider: interaction_aggregation
          uses: grappa_inter
          loss: grappa_inter_loss
          config:
            mode: grappa
            task_modes:
              type: grappa
              primary: grappa
              orient: grappa

override:
  model.modules.grappa_shower.model_name: ""
  model.modules.grappa_shower.weight_path: ""
  model.modules.grappa_track.model_name: ""
  model.modules.grappa_track.weight_path: ""

  # Cache the configured interaction graph once for standalone training.
  model.modules.grappa_inter.return_features: true
  model.modules.grappa_inter_loss.return_targets: true
