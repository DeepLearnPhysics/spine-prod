__meta__:
  kind: bundle
  version: "240805"
  date: "2024-08-05"
  description: Materialize generic UResNet-PPN semantic predictions as a staged cache

base:
  world_size: 1
  iterations: -1
  seed: 0
  unwrap: true
  split_output: true
  log_step: 1

io:
  loader:
    minibatch_size: 64
    shuffle: false
    num_workers: 8
    collate_fn: all
    dataset:
      name: larcv
      file_keys: null
      schema:
        data:
          parser: sparse3d
          sparse_event: sparse3d_pcluster
  writer:
    name: stage_hdf5
    file_name: null
    stage: segmentation
    keys: [seg_pred]
    split: true

model:
  name: full_chain
  to_numpy: true

  network_input:
    data: data

  modules:
    chain:
      stages:
        - name: segmentation
          provider: segmentation
          uses: uresnet_ppn
          config:
            mode: uresnet
            point_proposal: ppn

    # model_name strips the full-chain module prefix while loading the
    # standalone UResNet-PPN checkpoint supplied by the workflow.
    uresnet_ppn:
      model_name: ""
      weight_path: ""
      uresnet: !include model/common/uresnet/network_v1.yaml
      ppn: !include model/common/uresnet_ppn/ppn_v1.yaml

override:
  model.modules.uresnet_ppn.ppn.classify_endpoints: false
