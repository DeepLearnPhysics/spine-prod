__meta__:
  kind: fragment
  description: Materialize UResNet-PPN predictions and adapted cluster truth

base:
  world_size: 1
  iterations: -1
  seed: 0
  unwrap: true
  split_output: true
  log_step: 1

io:
  loader:
    minibatch_size: 256
    shuffle: false
    num_workers: 16
    collate_fn: all
    dataset:
      provider: larcv
      file_keys:
      schema:
        data:
          provider: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          provider: sparse3d
          sparse_event: sparse3d_pcluster_semantics
        clust_label:
          provider: cluster3d
          cluster_event: cluster3d_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          clean_data: true
          shape_precedence: [2, 1, 0, 3, 4, 6]
          # Match the historical full-chain supervision policy at the point
          # where canonical adapted truth is first materialized.
          particle_info:
            particle_event: particle_corrected
            type_include_secondary: false
            type_include_mpr: false
            primary_include_mpr: false
  writer:
    provider: cache
    stage: segmentation
    overwrite_stage: true
    # PPN points are canonical GrapPA inputs for reconstructed fragments.
    keys: [seg_pred, ppn_points, clust_label_adapt]

model:
  provider: full_chain
  to_numpy: true

  network_input:
    data: data
    seg_label: seg_label
    clust_label: clust_label

  modules:
    chain:
      stages:
        - name: segmentation
          uses: uresnet_ppn
          config:
            mode: uresnet
            point_proposal: ppn
            adapt_labels:
              break_eps: 1.1
              break_metric: chebyshev
              break_p: 2.0
              # shower, track, Michel and delta semantic IDs
              break_classes: [0, 1, 2, 3]
              weighted: true

override:
  # Strip the full-chain prefix while loading the standalone checkpoint.
  model.modules.uresnet_ppn.model_name: ""
  model.modules.uresnet_ppn.weight_path: ""
