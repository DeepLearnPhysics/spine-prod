# HD-derived recipe snapshot for the VD 261117 candidate; not a released VD model.
__meta__:
  kind: bundle
  version: "261022"
  date: "2026-10-22"
  description: Materialize DUNE-VD 10 kt module 1x8x6 261022 deghosting and calibration products

include: cache/dune-vd-10kt-1x8x6/uresnet_deghost/base_v1.yaml

# Calibration resolves detector volumes through the same geometry as inference.
geo:
  detector: dune-vd-10kt-1x8x6
  tag: dunevd10kt_3view_30deg_v3_refactored_1x8x6ref

model:
  modules:
    uresnet_deghost: !include model/dune-vd-10kt-1x8x6/uresnet_deghost/network_261022.yaml

override:
  model.modules.chain.stages:
    - name: deghosting
      provider: deghost
      uses: uresnet_deghost
      config:
        mode: uresnet
        charge_rescaling: collection
    - name: calibration
      config:
        mode: apply
        calibration: !include model/dune-vd-10kt-1x8x6/calibration/calibration_261022.yaml
