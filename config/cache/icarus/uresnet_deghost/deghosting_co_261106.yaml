__meta__:
  kind: bundle
  description: ICARUS deghosting cache
  version: "261106"
  date: "2026-11-06"
include:
  - cache/icarus/uresnet_deghost/base_v1.yaml
  - train/icarus/modifier/single/io_single_sources.yaml
model:
  modules:
    uresnet_deghost: !include "model/icarus/uresnet_deghost/network_240719.yaml"
geo:
  detector: icarus
  tag: icarus_v4
override:
  model.modules.chain.stages:
    - name: deghosting
      provider: deghost
      uses: uresnet_deghost
      config:
        mode: uresnet
        charge_rescaling: collection
    - name: calibration
      config:
        mode: apply
        calibration: !include "model/icarus/calibration/calibration_co_260410.yaml"
  io.loader.num_workers: 8
