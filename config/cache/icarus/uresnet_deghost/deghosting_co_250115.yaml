__meta__:
  kind: bundle
  description: ICARUS deghosting cache
  version: "250115"
  date: "2025-01-15"
include: cache/icarus/uresnet_deghost/base_v1.yaml
model:
  modules:
    uresnet_deghost: !include "model/icarus/uresnet_deghost/network_240719.yaml"
geo:
  detector: icarus
  tag: icarus_v4
override:
  model.modules.chain.stages:
    - name: deghosting
      provider: deghost
      uses: uresnet_deghost
      config:
        mode: uresnet
        charge_rescaling: collection
    - name: calibration
      config:
        mode: apply
        calibration:
          stages: []
