__meta__:
  kind: bundle
  description: ICARUS deghosting cache
  version: "240812"
  date: "2024-08-12"
include:
  - cache/icarus/uresnet_deghost/base_v1.yaml
  - train/icarus/modifier/single/io_single_sources.yaml
model:
  modules:
    uresnet_deghost: !include "model/icarus/uresnet_deghost/network_240719.yaml"
geo:
  detector: icarus
  tag: icarus_v4
override:
  model.modules.chain.stages:
    - name: deghosting
      provider: deghost
      uses: uresnet_deghost
      config:
        mode: uresnet
        charge_rescaling: collection
    - name: calibration
      config:
        mode: apply
        calibration:
          stages: []
  io.loader.dataset.schema.data.sparse_event_list:
    - sparse3d_reco_cryoE_hit_charge2
    - sparse3d_reco_cryoE_chi2
    - sparse3d_reco_cryoE_hit_charge0
    - sparse3d_reco_cryoE_hit_charge1
    - sparse3d_reco_cryoE_hit_charge2
    - sparse3d_reco_cryoE_hit_key0
    - sparse3d_reco_cryoE_hit_key1
    - sparse3d_reco_cryoE_hit_key2
