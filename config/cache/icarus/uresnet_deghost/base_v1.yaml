__meta__:
  kind: fragment
  description: Materialize deghosted and calibrated ICARUS point data
base:
  world_size: 1
  iterations: -1
  seed: 0
  unwrap: true
  split_output: true
  log_step: 1
io:
  loader:
    minibatch_size: 2
    shuffle: false
    num_workers: 16
    collate_fn: all
    dataset:
      provider: larcv
      file_keys: null
      schema:
        data:
          provider: sparse3d
          sparse_event_list:
            - sparse3d_reco_cryoE
            - sparse3d_reco_cryoE_chi2
            - sparse3d_reco_cryoE_hit_charge0
            - sparse3d_reco_cryoE_hit_charge1
            - sparse3d_reco_cryoE_hit_charge2
            - sparse3d_reco_cryoE_hit_key0
            - sparse3d_reco_cryoE_hit_key1
            - sparse3d_reco_cryoE_hit_key2
            - sparse3d_reco_cryoW
            - sparse3d_reco_cryoW_chi2
            - sparse3d_reco_cryoW_hit_charge0
            - sparse3d_reco_cryoW_hit_charge1
            - sparse3d_reco_cryoW_hit_charge2
            - sparse3d_reco_cryoW_hit_key0
            - sparse3d_reco_cryoW_hit_key1
            - sparse3d_reco_cryoW_hit_key2
          num_features: 8
        sources:
          provider: sparse3d
          sparse_event_list:
            - sparse3d_reco_cryoE_cryo
            - sparse3d_reco_cryoE_tpc
            - sparse3d_reco_cryoW_cryo
            - sparse3d_reco_cryoW_tpc
          feature_only: true
          num_features: 2
        meta:
          provider: meta
          sparse_event: sparse3d_pcluster
        run_info:
          provider: run_info
          sparse_event: sparse3d_pcluster
  writer:
    provider: cache
    stage: deghosting
    overwrite_stage: true
    keys:
      - data_calib
      - orig_index
model:
  provider: full_chain
  to_numpy: true
  network_input:
    data: data
    sources: sources
    meta: meta
    run_info: run_info
  modules:
    chain:
      stages:
        - name: deghosting
          provider: deghost
          uses: uresnet_deghost
          config:
            mode: uresnet
            charge_rescaling: collection
        - name: calibration
          config:
            mode: apply
override:
  model.modules.uresnet_deghost.model_name: ""
  model.modules.uresnet_deghost.weight_path: ""
