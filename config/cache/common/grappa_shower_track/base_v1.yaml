__meta__:
  kind: fragment
  description: Common particle-graph cache materialization contract

base:
  world_size: 1
  iterations: -1
  seed: 0
  unwrap: true
  split_output: true
  log_step: 1

io:
  loader:
    minibatch_size:
    shuffle: false
    num_workers: 16
    collate_fn: all
    dataset:
      provider: mixed
      primary:
        provider: larcv
        file_keys:
        schema:
          data:
            provider: sparse3d
            sparse_event: sparse3d_pcluster
          coord_label:
            provider: particle_coords
            particle_event:
            cluster_event: cluster3d_pcluster
      cache:
        path:
        stage: fragmentation
        stage_map:
          ppn_points: segmentation
          clust_label_adapt: segmentation
        keep_open: true
        keys:
          - ppn_points
          - clust_label_adapt
          - fragment_clusts
          - fragment_shapes
  writer:
    provider: cache
    stage: particle_aggregation
    keep_open: true
    overwrite_stage: true
    keys:
      - particle_graph_edge_index
      - particle_graph_node_features
      - particle_graph_edge_features
      - particle_graph_node_type_target
      - particle_graph_node_type_valid
      - particle_graph_node_primary_target
      - particle_graph_node_primary_valid
      - particle_graph_node_orient_target
      - particle_graph_node_orient_valid
      - particle_graph_edge_target
      - particle_graph_edge_valid

model:
  provider: full_chain
  to_numpy: true

  network_input:
    data: data
    ppn_points: ppn_points
    clust_label: clust_label_adapt
    coord_label: coord_label
    fragment_clusts: fragment_clusts
    fragment_shapes: fragment_shapes

  loss_input:
    clust_label: clust_label_adapt
    coord_label: coord_label

  modules:
    chain:
      inputs: [ppn_points, fragment_clusts, fragment_shapes]
      stages:
        - name: particle_aggregation
          uses: [grappa_shower, grappa_track]
          config:
            shower_aggregation: grappa
            shower_primary: grappa
            track_aggregation: grappa
            particle_aggregation:

        - name: particle_graph
          uses: grappa_inter
          loss: grappa_inter_loss

override:
  model.modules.grappa_shower.model_name: ""
  model.modules.grappa_shower.weight_path: ""
  model.modules.grappa_track.model_name: ""
  model.modules.grappa_track.weight_path: ""
