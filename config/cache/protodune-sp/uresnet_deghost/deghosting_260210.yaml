__meta__:
  kind: bundle
  version: "260210"
  date: "2026-02-10"
  description: Materialize ProtoDUNE-SP 260210 deghosting and calibration products

include: cache/protodune-sp/uresnet_deghost/base_v1.yaml

# Calibration resolves detector volumes through the same geometry as inference.
geo:
  detector: protodune-sp
  tag: protodunev7

model:
  modules:
    uresnet_deghost: !include model/protodune-sp/uresnet_deghost/network_260210.yaml

override:
  model.modules.chain.stages:
    - name: deghosting
      provider: deghost
      uses: uresnet_deghost
      config:
        mode: uresnet
        charge_rescaling: collection
    - name: calibration
      provider: calibration
      config:
        mode: apply
        calibration: !include model/protodune-sp/calibration/calibration_260210.yaml
