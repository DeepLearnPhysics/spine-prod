__meta__:
  kind: fragment
  description: Append ProtoDUNE-SP segmentation products after deghosting

base:
  world_size: 1
  iterations: -1
  seed: 0
  unwrap: true
  split_output: true
  log_step: 1

io:
  loader:
    minibatch_size: 16
    shuffle: false
    num_workers: 16
    collate_fn: all
    dataset:
      name: hdf5
      file_keys: null
      staged: true
      stage: deghosting
      keep_open: true
      keys: [data_calib, orig_index, seg_label, clust_label]
  writer:
    name: stage_hdf5
    file_name: null
    stage: segmentation
    keep_open: true
    overwrite_stage: true
    keys: [seg_pred, ppn_points, clust_label_adapt]

model:
  name: full_chain
  to_numpy: true

  network_input:
    data: data_calib
    orig_index: orig_index
    seg_label: seg_label
    clust_label: clust_label

  modules:
    chain:
      stages:
        - name: segmentation
          provider: segmentation
          uses: uresnet_ppn
          config:
            mode: uresnet
            point_proposal: ppn
            adapt_labels:
              break_eps: 1.1
              break_metric: chebyshev
              break_p: 2.0
              break_classes: [0, 1, 2, 3]
              weighted: true

override:
  # Omit model_name so SPINE accepts the full-chain namespace produced by the
  # one-stage trainer while retaining standalone-checkpoint compatibility.
  model.modules.uresnet_ppn.weight_path: ""
