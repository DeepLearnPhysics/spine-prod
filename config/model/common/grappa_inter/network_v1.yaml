__meta__:
  kind: fragment
  description: SPINE v1 interaction GrapPA network structure

nodes:
  source: group
  shapes: [shower, track, michel, delta]
  min_size: -1
  make_groups: true
graph:
  name: complete
  max_length: [500, 500, 0, 0, 25, 25, 25, 0, 0, 0]
  dist_algorithm: recursive
node_encoder:
  name: geo
  use_numpy: true
  add_value: true
  add_shape: true
  add_points: true
  add_local_dirs: true
  dir_max_dist: 5
  add_local_dedxs: true
  dedx_max_dist: 5
edge_encoder:
  name: geo
  use_numpy: true
gnn_model:
  name: meta
  node_feats: 33
  edge_feats: 19
  node_pred:
    type: 5
    primary: 2
    orient: 2
  edge_pred: 2
  edge_layer:
    name: mlp
    mlp:
      depth: 3
      width: null
      activation:
        name: lrelu
        negative_slope: 0.1
      normalization: batch_norm
  node_layer:
    name: mlp
    reduction: max
    attention: false
    message_mlp:
      depth: 3
      width: null
      activation:
        name: lrelu
        negative_slope: 0.1
      normalization: batch_norm
    aggr_mlp:
      depth: 3
      width: null
      activation:
        name: lrelu
        negative_slope: 0.1
      normalization: batch_norm
