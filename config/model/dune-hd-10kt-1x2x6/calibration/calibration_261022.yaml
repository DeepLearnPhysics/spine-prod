__meta__:
  kind: fragment
  version: "261022"
  date: "2026-10-22"
  description: DUNE-HD collection-charge calibration

# Invert collection-plane dune10kt_calorimetryalgmc.CalAreaConstants:
# 1 / 5.045e-3 ADC/electron = 198.21605550049554 electrons/ADC.
# Audited against current DUNE defaults on 2026-11-17.
# Gain: detector-specific collection CalAreaConstants[2], inverted for SPINE.
# https://github.com/DUNE/dunesw/blob/80dcb3ac044d4a0097864ce858b2e05807cba17c/fcl/common/calorimetry_dune10kt.fcl
# Modified-box alpha/beta: LArSoft reconstruction constants (not SPINE defaults).
# https://github.com/LArSoft/larcoreobj/blob/f88ccd1f95d8ce528f2fff8a97f030041d942022/larcoreobj/SimpleTypesAndConstants/PhysicalConstants.h
# FD field = 0.5 kV/cm and lifetime = 10400 us; adopt latest nominal settings.
# https://github.com/DUNE/dunecore/blob/1861034bf807a2f556a476615c0a0f212dc43a0e/dunecore/Utilities/detectorproperties_dune.fcl
# Fixed MIP dE/dx and density remain SPINE approximations, not fitted DUNE values.
# Lifetime and recombination commute only for this fixed-MIP conversion.
stages:
  - name: gain
    gain: 198.21605550049554
  - name: recombination
    model: mbox
    # DUNE/LArSoft coefficients; do not inherit SPINE ICARUS defaults.
    mbox_alpha: 0.930
    mbox_beta: 0.212
    efield: 0.5
    mip_dedx: 2.105168
  - name: lifetime
    lifetime: 10400
    # WireCell driftSpeed = 1.60563 mm/us, converted to cm/us.
    # https://github.com/DUNE/dunereco/blob/403e8b9afab7c0c26c9d63d76198872340a144d3/dunereco/DUNEWireCell/dune10kt-hd/wcls-sim-drift-simchannel-nf-sp.fcl
    driftv: 0.160563
