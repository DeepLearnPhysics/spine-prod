__meta__:
  kind: fragment
  description: SBND grappa_track network 260304

nodes:
  source: cluster
  shapes:
    - track
  make_groups: false
graph:
  provider: complete
  max_length: 100
  dist_algorithm: recursive
node_encoder:
  provider: geo
  use_numpy: true
  add_value: true
  add_shape: false
  add_points: true
  add_local_dirs: true
  add_local_dedxs: true
  dir_max_dist: 5
  dedx_max_dist: 5
edge_encoder:
  provider: geo
  use_numpy: true
gnn_model:
  provider: meta
  node_feats: 32
  edge_feats: 19
  edge_pred: 2
  edge_layer:
    provider: mlp
    mlp:
      depth: 3
      width: 64
      activation:
        provider: lrelu
        negative_slope: 0.1
      normalization: batch_norm
  node_layer:
    provider: mlp
    reduction: max
    attention: false
    message_mlp:
      depth: 3
      width: 64
      activation:
        provider: lrelu
        negative_slope: 0.1
      normalization: batch_norm
    aggr_mlp:
      depth: 3
      width: 64
      activation:
        provider: lrelu
        negative_slope: 0.1
      normalization: batch_norm
