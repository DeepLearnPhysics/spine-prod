__meta__:
  kind: fragment
  version: "260128"
  date: "2026-01-28"
  description: ProtoDUNE-VD 260128 full chain composed from deployed components

include: model/protodune-vd/full_chain/base_v1.yaml

override:
  model.weight_path: null
  model.network_input:
    data: data
    sources: sources
    seg_label: seg_label
    meta: meta
    run_info: run_info
  model.modules.chain.stages:
    - name: deghosting
      provider: deghost
      uses: uresnet_deghost
      loss: uresnet_deghost_loss
      config:
        mode: uresnet
        charge_rescaling: collection
    - name: calibration_before_segmentation
      provider: calibration
      uses: calibration
      config:
        mode: apply
    - name: segmentation
      uses: uresnet_ppn
      loss: uresnet_ppn_loss
      config:
        mode: uresnet
        point_proposal: ppn
    - name: fragmentation
      uses: graph_spice
      loss:
        graph_spice: graph_spice_loss
      config:
        mode: graph_spice
    - name: particle_aggregation
      uses:
        - grappa_shower
        - grappa_track
      loss:
        shower: grappa_shower_loss
        track: grappa_track_loss
      config:
        shower_aggregation: grappa
        shower_primary: grappa
        track_aggregation: grappa
        particle_aggregation: null
    - name: interaction_aggregation
      uses: grappa_inter
      loss: grappa_inter_loss
      config:
        mode: grappa
        task_modes:
          type: grappa
          primary: grappa
          orient: grappa
  model.modules.calibration: !include model/protodune-vd/calibration/calibration_260118.yaml
  model.modules.uresnet_deghost: !include model/protodune-vd/uresnet_deghost/network_260118.yaml
  model.modules.uresnet_deghost_loss: !include model/protodune-vd/uresnet_deghost/loss_260118.yaml
  model.modules.uresnet_ppn: !include model/protodune-vd/uresnet_ppn/network_260118.yaml
  model.modules.uresnet_ppn_loss: !include model/protodune-vd/uresnet_ppn/loss_260118.yaml
  model.modules.graph_spice: !include model/protodune-vd/graph_spice/network_260118.yaml
  model.modules.graph_spice_loss: !include model/protodune-vd/graph_spice/loss_260118.yaml
  model.modules.grappa_shower: !include model/protodune-vd/grappa_shower/network_260118.yaml
  model.modules.grappa_shower_loss: !include model/protodune-vd/grappa_shower/loss_260118.yaml
  model.modules.grappa_track: !include model/protodune-vd/grappa_track/network_full_chain_260118.yaml
  model.modules.grappa_track_loss: !include model/protodune-vd/grappa_track/loss_260118.yaml
  model.modules.grappa_inter: !include model/protodune-vd/grappa_inter/network_full_chain_260118.yaml
  model.modules.grappa_inter_loss: !include model/protodune-vd/grappa_inter/loss_260118.yaml
