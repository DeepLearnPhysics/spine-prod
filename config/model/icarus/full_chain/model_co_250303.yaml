__meta__:
  kind: fragment
  description: ICARUS released full-chain architecture and objectives
  version: "250303"
  date: "2025-03-03"
geo:
  detector: icarus
  tag: icarus_v4
model:
  provider: full_chain
  weight_path: null
  to_numpy: true
  network_input:
    data: data
    sources: sources
    seg_label: seg_label
    meta: meta
    run_info: run_info
  modules:
    chain:
      stages:
        - name: deghosting
          provider: deghost
          uses: uresnet_deghost
          loss: uresnet_deghost_loss
          config:
            mode: uresnet
            charge_rescaling: collection
        - name: calibration_before_segmentation
          provider: calibration
          uses: calibration
          config:
            mode: apply
        - name: segmentation
          uses: uresnet_ppn
          loss: uresnet_ppn_loss
          config:
            mode: uresnet
            point_proposal: ppn
        - name: fragmentation
          uses: graph_spice
          loss:
            graph_spice: graph_spice_loss
          config:
            mode: graph_spice
        - name: particle_aggregation
          uses:
            - grappa_shower
            - grappa_track
          loss:
            shower: grappa_shower_loss
            track: grappa_track_loss
          config:
            shower_aggregation: grappa
            shower_primary: grappa
            track_aggregation: grappa
            particle_aggregation: null
        - name: interaction_aggregation
          uses: grappa_inter
          loss: grappa_inter_loss
          config:
            mode: grappa
            task_modes:
              type: grappa
              primary: grappa
              orient: grappa
    uresnet_deghost: !include "model/icarus/uresnet_deghost/network_240719.yaml"
    uresnet_deghost_loss: !include "model/icarus/uresnet_deghost/loss_240719.yaml"
    uresnet_ppn: !include "model/icarus/uresnet_ppn/network_240812.yaml"
    uresnet_ppn_loss: !include "model/icarus/uresnet_ppn/loss_240812.yaml"
    graph_spice: !include "model/icarus/graph_spice/network_240719.yaml"
    graph_spice_loss: !include "model/icarus/graph_spice/loss_240719.yaml"
    grappa_shower: !include "model/icarus/grappa_shower/network_240719.yaml"
    grappa_shower_loss: !include "model/icarus/grappa_shower/loss_240719.yaml"
    grappa_track: !include "model/icarus/grappa_track/network_full_chain_240719.yaml"
    grappa_track_loss: !include "model/icarus/grappa_track/loss_240719.yaml"
    grappa_inter: !include "model/icarus/grappa_inter/network_full_chain_250115.yaml"
    grappa_inter_loss: !include "model/icarus/grappa_inter/loss_240719.yaml"
    calibration: !include "model/icarus/calibration/calibration_co_250303.yaml"
