__meta__:
  kind: fragment
  version: "240819"
  date: "2024-08-19"
  description: 2x2 deployed graph_spice network

shapes:
  - shower
  - track
  - michel
  - delta
use_raw_features: true
invert: true
make_clusters: true
embedder:
  spatial_embedding_dim: 3
  feature_embedding_dim: 16
  occupancy_mode: softplus
  covariance_mode: softplus
  uresnet:
    num_input: 4
    filters: 32
    input_kernel: 5
    depth: 5
    reps: 2
    spatial_size: 320
    allow_bias: false
    activation:
      provider: lrelu
      negative_slope: 0.33
    norm_layer:
      provider: batch_norm
      eps: 0.0001
      momentum: 0.01
kernel:
  provider: bilinear
  num_features: 32
constructor:
  edge_threshold: 0.1
  min_size: 3
  label_edges: false
  graph:
    provider: radius
    r: 1.9
  orphan:
    mode: radius
    radius: 1.9
    iterate: true
    assign_all: true
