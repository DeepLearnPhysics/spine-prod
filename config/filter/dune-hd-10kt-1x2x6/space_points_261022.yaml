__meta__:
  kind: bundle
  version: "261022"
  date: "2026-10-22"
  description: Reject pathological DUNE-HD 10 kt module 1x2x6 tomographic events

input:
  provider: larcv
measurements:
  sparse3d_reco:
    kind: product_size
  sparse3d_pcluster:
    kind: product_size
  particle_corrected:
    kind: product_size

filters:
