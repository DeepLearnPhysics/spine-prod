__meta__:
  kind: bundle
  version: "260118"
  date: "2026-01-18"
  description: Reject pathological ProtoDUNE-VD tomographic events

input:
  provider: larcv
measurements:
  sparse3d_reco:
    kind: product_size
  sparse3d_pcluster:
    kind: product_size
  particle_corrected:
    kind: product_size

filters:
  # max_count is exclusive: accepted entries contain fewer than 500k points.
  sparse3d_reco:
    max_count: 500000
