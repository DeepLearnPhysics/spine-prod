__meta__:
  kind: bundle
  description: Evaluate ICARUS full chain
  version: "261106"
  date: "2026-11-06"
include:
  - infer/icarus/base/base_240719.yaml
  - infer/icarus/io/io_240812.yaml
  - infer/icarus/post/post_260501.yaml
  - model/icarus/full_chain/model_261106.yaml
  - test/common/full_chain/analyzers_v1.yaml
override:
  io.writer: null
  model.network_input.clust_label: clust_label
  post.stages~:
    - remove:
        name: flash_match
    - update:
        name: match
        changes:
          ghost: true
  ana.stages~:
    - update:
        name: segment_eval
        changes:
          ghost: true
    - update:
        name: shower_primary_eval
        changes:
          use_closest: true
          high_purity: true
          use_group_pred: true
  io.loader.dataset.schema.clust_label:
    provider: cluster3d
    cluster_event: cluster3d_pcluster
    sparse_semantics_event: sparse3d_pcluster_semantics
    clean_data: true
    particle_info:
      particle_event: particle_corrected
      neutrino_event: neutrino_mpv
      type_include_secondary: false
      type_include_mpr: false
      primary_include_mpr: false
remove:
  - io.loader.dataset.schema.flashes
  - io.loader.dataset.schema.crthits
