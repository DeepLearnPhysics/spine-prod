__meta__:
  kind: bundle
  description: Evaluate ICARUS full chain
  version: "240812"
  date: "2024-08-12"
include:
  - infer/icarus/base/base_240719.yaml
  - infer/icarus/io/io_co_240812.yaml
  - infer/icarus/post/post_240719.yaml
  - model/icarus/full_chain/model_co_240812.yaml
  - test/common/full_chain/analyzers_v1.yaml
  - train/icarus/modifier/single/io_single_sources.yaml
override:
  io.loader.dataset.schema.charge_label:
    provider: sparse3d
    sparse_event: sparse3d_reco_cryoE_rescaled
  io.writer: null
  model.network_input.clust_label: clust_label
  post.stages~:
    - remove:
        name: particle_threshold
    - remove:
        name: flash_match
    - update:
        name: match
        changes:
          ghost: true
  ana.stages~:
    - update:
        name: segment_eval
        changes:
          ghost: true
    - update:
        name: shower_primary_eval
        changes:
          use_closest: false
          high_purity: true
          use_group_pred: true
remove:
  - io.loader.dataset.schema.flashes
  - io.loader.dataset.schema.crthits
