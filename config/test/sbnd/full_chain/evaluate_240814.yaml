__meta__:
  kind: bundle
  version: "240814"
  date: "2024-08-14"
  description: Evaluate the SBND 240814 full chain
include:
  - infer/sbnd/base/base_240720.yaml
  - infer/sbnd/io/io_240720.yaml
  - model/sbnd/full_chain/model_240814.yaml
  - infer/sbnd/post/post_240720.yaml
  - test/common/full_chain/analyzers_v1.yaml
override:
  io.writer: null
  model.network_input.clust_label: clust_label
  post.stages~:
    - update:
        name: match
        changes:
          ghost: true
  ana.stages~:
    - update:
        name: segment_eval
        changes:
          ghost: true
    - update:
        name: shower_primary_eval
        changes:
          use_closest: false
          high_purity: true
          use_group_pred: true
remove:
  - io.loader.dataset.schema.flashes
  - io.loader.dataset.schema.flashes_xa
  - io.loader.dataset.schema.run_info
