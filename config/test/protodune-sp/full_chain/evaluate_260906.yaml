__meta__:
  kind: bundle
  version: "260906"
  date: "2026-09-06"
  description: Evaluate the trained ProtoDUNE-SP 260906 full chain

include:
  - infer/protodune-sp/base/base_260210.yaml
  - infer/protodune-sp/io/io_260210.yaml
  - model/protodune-sp/full_chain/model_260906.yaml
  - infer/protodune-sp/post/post_260210.yaml
  - test/common/full_chain/analyzers_v1.yaml

override:
  # This stage emits analyzer CSVs only; reconstruction HDF5 is unnecessary.
  io.writer: null

  # Adapt cluster truth only for metric evaluation.
  model.network_input.clust_label: clust_label

  # Preserve the raw/deghosted index distinction in evaluation and include
  # deghosting itself in the semantic confusion counts.
  post.match.ghost: true
  ana.segment_eval.ghost: true
