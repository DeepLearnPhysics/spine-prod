# Bounded end-to-end validation of the ND-LAr 260409 training pipeline.
# The training domain is restricted to two source files (roughly 15,000 events)
# and validation to one source file. The first 1,000 validation events drive
# training validation and the next 1,000 drive final evaluation. Training
# retains each model's standard epoch ceiling and early-stopping policy.

workspace: null

variables:
  train_source_list: /sdf/data/neutrino/ndlar/sim/mpvmpr_v01/train_file_list.txt
  validation_source_list: /sdf/data/neutrino/ndlar/sim/mpvmpr_v01/test_file_list.txt
  shower_filter_cache_dir: ${workspace}/filter/shower_edges/counts

collections:
  splits:
    - name: train
      source_list: ${train_source_list}
      cache_dir: ${workspace}/cache/train
      cache_repository: ${workspace}/cache/train.spine-cache
      num_files: 2
      shower_entry_filter: ${workspace}/filter/shower_edges/train/accepted.yaml
      shower_filtered_source_list: ${workspace}/filter/shower_edges/train/accepted_sources.txt
    - name: validation
      source_list: ${validation_source_list}
      cache_dir: ${workspace}/cache/validation
      cache_repository: ${workspace}/cache/validation.spine-cache
      num_files: 1
      shower_entry_filter: ${workspace}/filter/shower_edges/validation/accepted.yaml
      shower_filtered_source_list: ${workspace}/filter/shower_edges/validation/accepted_sources.txt

defaults:
  profile: s3df_ampere
  time: "08:00:00"

stages:
  - name: train_uresnet_ppn
    config: train/nd-lar/uresnet_ppn/train_260409.yaml
    stage: train
    profile: s3df_ampere_full
    time: "1-00:00:00"
    source_list: ${train_source_list}
    val_source_list: ${validation_source_list}
    run_dir: ${workspace}/train/uresnet_ppn
    tensorboard: true
    num_files: 2
    val_num_files: 1
    val_num_entries: 1000
    apply_mods: ["augment_uresnet:260912"]
    set:
      # Map the standalone destinations onto the full-chain checkpoint names.
      - model.modules.uresnet.model_name=uresnet_ppn.uresnet
      - model.modules.ppn.model_name=uresnet_ppn.ppn

  - name: cache_${split.name}_segmentation
    for_each:
      collection: splits
      as: split
    depends_on: [train_uresnet_ppn]
    config: cache/nd-lar/uresnet_ppn/segmentation_240819.yaml
    source_list: ${split.source_list}
    run_dir: ${split.cache_dir}/segmentation
    output: ${split.cache_repository}
    cache_repository: ${split.cache_repository}
    cache_stage: segmentation
    ntasks: 2
    files_per_task: 1
    num_files: ${split.num_files}
    module_weight:
      uresnet_ppn: ${workspace}/train/uresnet_ppn/weights/snapshot-best.ckpt

  - name: train_graph_spice
    depends_on: [cache_train_segmentation, cache_validation_segmentation]
    config: train/nd-lar/graph_spice/train_from_uresnet_ppn_260409.yaml
    stage: train
    profile: s3df_ampere_full
    time: "1-00:00:00"
    # Graph-SPICE memory scales strongly with event occupancy. Leave enough
    # headroom for the largest images in this deliberately small sample.
    minibatch_size: 8
    run_dir: ${workspace}/train/graph_spice
    tensorboard: true
    num_files: 2
    val_num_files: 1
    val_num_entries: 1000
    apply_mods: ["augment_graph_spice:260912"]
    sources:
      primary:
        source_list: ${train_source_list}
      cache:
        source: ${workspace}/cache/train.spine-cache
    validation_sources:
      primary:
        source_list: ${validation_source_list}
      cache:
        source: ${workspace}/cache/validation.spine-cache

  - name: cache_${split.name}_fragment_graphs
    for_each:
      collection: splits
      as: split
    depends_on: [train_graph_spice]
    config: cache/nd-lar/graph_spice/fragment_graphs_260409.yaml
    run_dir: ${split.cache_dir}/fragmentation
    in_place: true
    cache_repository: ${split.cache_repository}
    cache_stage: fragmentation
    ntasks: 2
    files_per_task: 1
    num_files: ${split.num_files}
    sources:
      primary:
        source_list: ${split.source_list}
      cache:
        source: ${split.cache_repository}
    module_weight:
      graph_spice: ${workspace}/train/graph_spice/weights/snapshot-best.ckpt

  # Scan the existing fragment caches by offset metadata; no recache is needed.
  - name: scan_${split.name}_shower_edges
    for_each:
      collection: splits
      as: split
    kind: filter
    operation: scan
    depends_on: ["cache_${split.name}_fragment_graphs"]
    config: filter/nd-lar/shower_edges_260922.yaml
    source: ${split.cache_repository}
    cache_dir: ${shower_filter_cache_dir}
    run_dir: ${workspace}/filter/shower_edges/${split.name}/scan
    profile: s3df_milano
    workers: 1

  - name: build_${split.name}_shower_edges
    for_each:
      collection: splits
      as: split
    kind: filter
    operation: build
    depends_on: ["scan_${split.name}_shower_edges"]
    config: filter/nd-lar/shower_edges_260922.yaml
    source: ${split.cache_repository}
    cache_dir: ${shower_filter_cache_dir}
    output: ${split.shower_entry_filter}
    output_source_list: ${split.shower_filtered_source_list}
    run_dir: ${workspace}/filter/shower_edges/${split.name}/build
    profile: s3df_milano

  - name: train_grappa_shower
    depends_on: [build_train_shower_edges, build_validation_shower_edges]
    config: train/nd-lar/grappa_shower/train_from_fragment_cache_260409.yaml
    stage: train
    profile: s3df_ampere_full
    time: "3-00:00:00"
    minibatch_size: 1
    source: ${workspace}/cache/train.spine-cache
    val_source: ${workspace}/cache/validation.spine-cache
    entry_filter: ${workspace}/filter/shower_edges/train/accepted.yaml
    val_entry_filter: ${workspace}/filter/shower_edges/validation/accepted.yaml
    run_dir: ${workspace}/train/grappa_shower
    tensorboard: true
    val_num_entries: 1000
    set:
      # The optional smoke-test seed is a full-chain checkpoint, while the
      # standalone training destination is named `grappa`.
      - model.modules.grappa.model_name=grappa_shower

  - name: train_grappa_track
    depends_on: [cache_train_fragment_graphs, cache_validation_fragment_graphs]
    config: train/nd-lar/grappa_track/train_from_fragment_cache_260409.yaml
    stage: train
    time: "12:00:00"
    minibatch_size: 32
    source: ${workspace}/cache/train.spine-cache
    val_source: ${workspace}/cache/validation.spine-cache
    run_dir: ${workspace}/train/grappa_track
    tensorboard: true
    val_num_entries: 1000
    set:
      # The optional smoke-test seed is a full-chain checkpoint, while the
      # standalone training destination is named `grappa`.
      - model.modules.grappa.model_name=grappa_track

  - name: cache_${split.name}_particle_graphs
    for_each:
      collection: splits
      as: split
    depends_on: [train_grappa_shower, train_grappa_track]
    config: cache/nd-lar/grappa_shower_track/particle_graphs_260409.yaml
    run_dir: ${split.cache_dir}/particle_aggregation
    in_place: true
    cache_repository: ${split.cache_repository}
    cache_stage: particle_aggregation
    ntasks: 2
    files_per_task: 1
    num_files: ${split.num_files}
    sources:
      primary:
        source_list: ${split.source_list}
      cache:
        source: ${split.cache_repository}
    module_weight:
      grappa_shower: ${workspace}/train/grappa_shower/weights/snapshot-best.ckpt
      grappa_track: ${workspace}/train/grappa_track/weights/snapshot-best.ckpt

  - name: train_grappa_inter
    depends_on: [cache_train_particle_graphs, cache_validation_particle_graphs]
    config: train/nd-lar/grappa_inter/train_from_particle_cache_260409.yaml
    stage: train
    time: "12:00:00"
    source: ${workspace}/cache/train.spine-cache
    val_source: ${workspace}/cache/validation.spine-cache
    run_dir: ${workspace}/train/grappa_inter
    tensorboard: true
    val_num_entries: 1000

  - name: export_full_chain_weights
    depends_on: [train_grappa_inter]
    config: model/nd-lar/full_chain/model_260409.yaml
    profile: s3df_milano
    time: "00:30:00"
    run_dir: ${workspace}/weights/export
    export_weights: ${workspace}/weights/full_chain_260409.ckpt
    module_weight:
      uresnet_ppn: ${workspace}/train/uresnet_ppn/weights/snapshot-best.ckpt
      graph_spice: ${workspace}/train/graph_spice/weights/snapshot-best.ckpt
      grappa_shower: ${workspace}/train/grappa_shower/weights/snapshot-best.ckpt
      grappa_track: ${workspace}/train/grappa_track/weights/snapshot-best.ckpt
      grappa_inter: ${workspace}/train/grappa_inter/weights/snapshot-best.ckpt

  - name: evaluate_full_chain
    depends_on: [export_full_chain_weights]
    config: test/nd-lar/full_chain/evaluate_260409.yaml
    source_list: ${validation_source_list}
    run_dir: ${workspace}/metrics/full_chain/raw
    in_place: true
    weight_path: ${workspace}/weights/full_chain_260409.ckpt
    num_workers: 16
    ntasks: 1
    num_files: 1
    num_entries: 1000
    set: [io.loader.dataset.n_skip=1000]

  - name: report_full_chain
    kind: report
    depends_on: [evaluate_full_chain]
    config: test/nd-lar/full_chain/report_240819.yaml
    input_dir: ${workspace}/metrics/full_chain/raw/latest
    output_dir: ${workspace}/metrics/full_chain/report/artifacts
    run_dir: ${workspace}/metrics/full_chain/report
    checkpoint: ${workspace}/weights/full_chain_260409.ckpt
    dataset: ${validation_source_list}
    dataset_selection:
      num_files: 1
      n_skip: 1000
      n_entry: 1000
    profile: s3df_milano
    time: "00:30:00"
