# Staged training of every learned component used by the ProtoDUNE-SP 260210
# full chain. Supply its destination with CLI --workspace.
# Each source file owns one cache file; later stages append named groups.

workspace: null

variables:
  train_source_list: /sdf/data/neutrino/pdune/sim/sp/mpvmpr_v0/train_file_list.txt
  validation_source_list: /sdf/data/neutrino/pdune/sim/sp/mpvmpr_v0/test_file_list.txt

collections:
  splits:
    - name: train
      source_list: ${train_source_list}
      cache_dir: ${workspace}/cache/train
      cache_source_list: ${workspace}/cache/train/cache_file_list.txt
    - name: validation
      source_list: ${validation_source_list}
      cache_dir: ${workspace}/cache/validation
      cache_source_list: ${workspace}/cache/validation/cache_file_list.txt

defaults:
  profile: s3df_ampere
  time: "08:00:00"

stages:
  # Train binary deghosting directly from the raw charge and chi-squared views.
  - name: train_uresnet_deghost
    config: train/protodune-sp/uresnet_deghost/train_260210.yaml
    stage: train
    profile: s3df_ampere_full
    source_list: ${train_source_list}
    val_source_list: ${validation_source_list}
    val_entry_fraction_range: [0.0, 0.5]
    run_dir: ${workspace}/train/uresnet_deghost
    tensorboard: true

  # Materialize calibrated deghosted data and raw supervision exactly once.
  - name: cache_${split.name}_deghosting
    for_each:
      collection: splits
      as: split
    depends_on: [train_uresnet_deghost]
    config: cache/protodune-sp/uresnet_deghost/deghosting_260210.yaml
    source_list: ${split.source_list}
    run_dir: ${split.cache_dir}/deghosting
    output: ${split.cache_dir}
    output_suffix: cache
    output_source_list: ${split.cache_source_list}
    files_per_task: 1
    ntasks: 50
    module_weight:
      uresnet_deghost: ${workspace}/train/uresnet_deghost/weights/snapshot-best.ckpt

  # Train semantic segmentation and point proposal on the cached point domain.
  - name: train_uresnet_ppn
    depends_on: [cache_train_deghosting, cache_validation_deghosting]
    config: train/protodune-sp/uresnet_ppn/train_from_deghost_cache_260210.yaml
    stage: train
    profile: s3df_ampere_full
    run_dir: ${workspace}/train/uresnet_ppn
    tensorboard: true
    source_list: ${workspace}/cache/train/cache_file_list.txt
    val_source_list: ${workspace}/cache/validation/cache_file_list.txt
    val_entry_fraction_range: [0.0, 0.5]

  # Append segmentation predictions and adapted cluster labels to each cache.
  - name: cache_${split.name}_segmentation
    for_each:
      collection: splits
      as: split
    depends_on: [train_uresnet_ppn]
    config: cache/protodune-sp/uresnet_ppn/segmentation_260210.yaml
    run_dir: ${split.cache_dir}/segmentation
    in_place: true
    source_list: ${split.cache_source_list}
    files_per_task: 1
    ntasks: 50
    module_weight:
      uresnet_ppn: ${workspace}/train/uresnet_ppn/weights/snapshot-best.ckpt

  # Train Graph-SPICE solely from calibrated and segmented cache products.
  - name: train_graph_spice
    depends_on: [cache_train_segmentation, cache_validation_segmentation]
    config: train/protodune-sp/graph_spice/train_from_segmentation_cache_260210.yaml
    stage: train
    profile: s3df_ampere_full
    source_list: ${workspace}/cache/train/cache_file_list.txt
    val_source_list: ${workspace}/cache/validation/cache_file_list.txt
    val_entry_fraction_range: [0.0, 0.5]
    run_dir: ${workspace}/train/graph_spice
    tensorboard: true

  # Append fragment graphs and static supervision for both particle branches.
  - name: cache_${split.name}_fragment_graphs
    for_each:
      collection: splits
      as: split
    depends_on: [train_graph_spice]
    config: cache/protodune-sp/graph_spice/fragment_graphs_260210.yaml
    run_dir: ${split.cache_dir}/fragmentation
    in_place: true
    source_list: ${split.cache_source_list}
    files_per_task: 1
    ntasks: 50
    module_weight:
      graph_spice: ${workspace}/train/graph_spice/weights/snapshot-best.ckpt

  # Train shower aggregation and shower-primary identification from cache.
  - name: train_grappa_shower
    depends_on: [cache_train_fragment_graphs, cache_validation_fragment_graphs]
    config: train/protodune-sp/grappa_shower/train_from_fragment_cache_260210.yaml
    stage: train
    source_list: ${workspace}/cache/train/cache_file_list.txt
    val_source_list: ${workspace}/cache/validation/cache_file_list.txt
    val_entry_fraction_range: [0.0, 0.5]
    run_dir: ${workspace}/train/grappa_shower
    tensorboard: true

  # Train track aggregation concurrently from the same fragment cache.
  - name: train_grappa_track
    depends_on: [cache_train_fragment_graphs, cache_validation_fragment_graphs]
    config: train/protodune-sp/grappa_track/train_from_fragment_cache_260210.yaml
    stage: train
    source_list: ${workspace}/cache/train/cache_file_list.txt
    val_source_list: ${workspace}/cache/validation/cache_file_list.txt
    val_entry_fraction_range: [0.0, 0.5]
    run_dir: ${workspace}/train/grappa_track
    tensorboard: true

  # Append particle graphs and static interaction supervision to each cache.
  - name: cache_${split.name}_particle_graphs
    for_each:
      collection: splits
      as: split
    depends_on: [train_grappa_shower, train_grappa_track]
    config: cache/protodune-sp/grappa_shower_track/particle_graphs_260210.yaml
    source_list: ${split.cache_source_list}
    run_dir: ${split.cache_dir}/particle_aggregation
    in_place: true
    files_per_task: 1
    ntasks: 50
    module_weight:
      grappa_shower: ${workspace}/train/grappa_shower/weights/snapshot-best.ckpt
      grappa_track: ${workspace}/train/grappa_track/weights/snapshot-best.ckpt

  # Train interaction aggregation and particle classifiers from cached graphs.
  - name: train_grappa_inter
    depends_on: [cache_train_particle_graphs, cache_validation_particle_graphs]
    config: train/protodune-sp/grappa_inter/train_from_particle_cache_260210.yaml
    stage: train
    source_list: ${workspace}/cache/train/cache_file_list.txt
    val_source_list: ${workspace}/cache/validation/cache_file_list.txt
    val_entry_fraction_range: [0.0, 0.5]
    run_dir: ${workspace}/train/grappa_inter
    tensorboard: true

  # Export all six learned modules as one inference checkpoint.
  - name: export_full_chain_weights
    depends_on: [train_grappa_inter]
    config: model/protodune-sp/full_chain/model_260210.yaml
    profile: s3df_milano
    time: "00:30:00"
    run_dir: ${workspace}/weights/export
    export_weights: ${workspace}/weights/full_chain_260210.ckpt
    module_weight:
      uresnet_deghost: ${workspace}/train/uresnet_deghost/weights/snapshot-best.ckpt
      uresnet_ppn: ${workspace}/train/uresnet_ppn/weights/snapshot-best.ckpt
      graph_spice: ${workspace}/train/graph_spice/weights/snapshot-best.ckpt
      grappa_shower: ${workspace}/train/grappa_shower/weights/snapshot-best.ckpt
      grappa_track: ${workspace}/train/grappa_track/weights/snapshot-best.ckpt
      grappa_inter: ${workspace}/train/grappa_inter/weights/snapshot-best.ckpt

  # Evaluate held-out events with the assembled full-chain checkpoint.
  - name: evaluate_full_chain
    depends_on: [export_full_chain_weights]
    config: test/protodune-sp/full_chain/evaluate_260210.yaml
    source_list: ${validation_source_list}
    entry_fraction_range: [0.5, 1.0]
    run_dir: ${workspace}/metrics/full_chain/raw
    in_place: true
    weight_path: ${workspace}/weights/full_chain_260210.ckpt
    num_workers: 16
    files_per_task: 1
    ntasks: 50

  # Reduce completed metric shards into checksummed JSON and plots.
  - name: report_full_chain
    kind: report
    depends_on: [evaluate_full_chain]
    config: test/common/full_chain/report_v1.yaml
    input_dir: ${workspace}/metrics/full_chain/raw/latest
    output_dir: ${workspace}/metrics/full_chain/report/artifacts
    run_dir: ${workspace}/metrics/full_chain/report
    checkpoint: ${workspace}/weights/full_chain_260210.ckpt
    dataset: ${validation_source_list}
    dataset_selection:
      entry_fraction_range: [0.5, 1.0]
    profile: s3df_milano
    time: "00:30:00"
