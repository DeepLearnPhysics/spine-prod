# Matched queue experiment: 12-hour runtime budget, 6-hour allocations.
# Use a separate workspace and Scratch continuation directory for each case.
# See docs/training-continuation.md for launch and comparison instructions.
workspace: null
variables:
  train_source_list: /path/to/train.txt
  validation_source_list: /path/to/validation.txt
defaults:
  profile: nersc_gpu_full
  time: "06:00:00"
stages:
  - name: train_uresnet_ppn
    stage: train
    config: train/generic/uresnet_ppn/train_240805.yaml
    run_dir: ${workspace}/train
    source_list: ${train_source_list}
    val_source_list: ${validation_source_list}
    # Budget-limited timing benchmark, not a scientific stopping prescription.
    iterations: 1000000000
    set:
      - validation.early_stopping=null
    continuation:
      runtime_budget: "12:00:00"
      checkpoint_margin: "00:02:00"
      startup_allowance: "00:02:00"
      site_min_time: "00:05:00"
      max_attempts: 100
