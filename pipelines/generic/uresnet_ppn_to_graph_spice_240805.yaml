# Prototype transition: train UResNet-PPN, cache its predictions, then train
# standalone Graph-SPICE from aligned raw truth and staged predictions.
# Replace the /path/to/workflow destination before submission.

stages:
  - name: train_uresnet_ppn
    config: train/generic/uresnet_ppn/train_240805.yaml
    stage: train
    source: /sdf/data/neutrino/generic/mpvmpr_2020_01_v04/train.root
    val_source: /sdf/data/neutrino/generic/mpvmpr_2020_01_v04/test.root
    run_dir: /path/to/workflow/train/uresnet_ppn
    profile: s3df_ampere
    tensorboard: true

  - name: cache_train_segmentation
    depends_on: [train_uresnet_ppn]
    config: cache/generic/uresnet_ppn/segmentation_240805.yaml
    source: /sdf/data/neutrino/generic/mpvmpr_2020_01_v04/train.root
    output: /path/to/workflow/cache/train
    output_suffix: segmentation
    profile: s3df_ampere
    files_per_task: 1
    ntasks: 50
    module_weight:
      uresnet_ppn: /path/to/workflow/train/uresnet_ppn/weights/snapshot-best.ckpt

  - name: cache_validation_segmentation
    depends_on: [train_uresnet_ppn]
    config: cache/generic/uresnet_ppn/segmentation_240805.yaml
    source: /sdf/data/neutrino/generic/mpvmpr_2020_01_v04/test.root
    output: /path/to/workflow/cache/validation
    output_suffix: segmentation
    profile: s3df_ampere
    files_per_task: 1
    ntasks: 50
    module_weight:
      uresnet_ppn: /path/to/workflow/train/uresnet_ppn/weights/snapshot-best.ckpt

  - name: train_graph_spice
    depends_on: [cache_train_segmentation, cache_validation_segmentation]
    config: train/generic/graph_spice/train_from_uresnet_ppn_240805.yaml
    stage: train
    run_dir: /path/to/workflow/train/graph_spice
    profile: s3df_ampere
    tensorboard: true
    sources:
      larcv:
        source: /sdf/data/neutrino/generic/mpvmpr_2020_01_v04/train.root
      hdf5:
        source: /path/to/workflow/cache/train/train_segmentation.h5
    validation_sources:
      larcv:
        source: /sdf/data/neutrino/generic/mpvmpr_2020_01_v04/test.root
      hdf5:
        source: /path/to/workflow/cache/validation/test_segmentation.h5
