# Staged transition: train UResNet-PPN, cache its predictions and adapted
# cluster truth, then train standalone Graph-SPICE from those stage products.
# Supply the workflow destination with CLI --workspace.
# The cache repository matches the appendable full-chain workflow.

workspace: null

variables:
  train_source: /sdf/data/neutrino/generic/mpvmpr_2020_01_v04/train.root
  validation_source: /sdf/data/neutrino/generic/mpvmpr_2020_01_v04/test.root

collections:
  splits:
    - name: train
      source: ${train_source}
      cache_dir: ${workspace}/cache/train
      cache_repository: ${workspace}/cache/train.spine-cache
    - name: validation
      source: ${validation_source}
      cache_dir: ${workspace}/cache/validation
      cache_repository: ${workspace}/cache/validation.spine-cache

defaults:
  profile: s3df_ampere
  time: "08:00:00"

stages:
  - name: train_uresnet_ppn
    config: train/generic/uresnet_ppn/train_240805.yaml
    stage: train
    source: ${train_source}
    val_source: ${validation_source}
    run_dir: ${workspace}/train/uresnet_ppn
    tensorboard: true

  - name: cache_${split.name}_segmentation
    for_each:
      collection: splits
      as: split
    depends_on: [train_uresnet_ppn]
    config: cache/generic/uresnet_ppn/segmentation_240805.yaml
    source: ${split.source}
    run_dir: ${split.cache_dir}/segmentation
    output: ${split.cache_repository}
    cache_repository: ${split.cache_repository}
    cache_stage: segmentation
    files_per_task: 1
    # Train and validation arrays run together: two tasks each cap total GPUs at 4.
    ntasks: 2
    module_weight:
      uresnet_ppn: ${workspace}/train/uresnet_ppn/weights/snapshot-best.ckpt

  - name: train_graph_spice
    depends_on: [cache_train_segmentation, cache_validation_segmentation]
    config: train/generic/graph_spice/train_from_uresnet_ppn_240805.yaml
    stage: train
    run_dir: ${workspace}/train/graph_spice
    tensorboard: true
    sources:
      primary:
        source: ${train_source}
      cache:
        source: ${workspace}/cache/train.spine-cache
    validation_sources:
      primary:
        source: ${validation_source}
      cache:
        source: ${workspace}/cache/validation.spine-cache
